<!DOCTYPE html>

        .container { background-color: #1e293b; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); max-width: 450px; width: 100%; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }

        .btn:hover { transform: scale(1.03); background-color: #eab308; }
        .btn:active { transform: scale(0.95); }
        .btn-blue { background-color: #3b82f6; color: white; }
