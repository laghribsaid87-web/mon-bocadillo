<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Bocadillo - Menu Mapping KDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --surface-hover: rgba(51, 65, 85, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #f59e0b; /* Glovo Yellow/Orange */
            --accent-hover: #d97706;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .title-group h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--surface-hover);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border-color: rgba(239, 68, 68, 0.3);
            padding: 0.4rem 0.8rem;
        }

        .btn-danger:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            backdrop-filter: blur(10px);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-family: monospace;
        }

        .badge-glovo {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-caisse {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.25rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .modal-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            display: none;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success-color);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-group">
                <h1>Menu Mapping</h1>
                <p>Synchronisation des produits Glovo vers la Caisse (KDS)</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="fas fa-plus"></i> Nouveau Produit
            </button>
        </header>

        <div class="controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher un produit Glovo ou Caisse..." onkeyup="filterTable()">
            </div>
            <button class="btn" onclick="fetchMappings()">
                <i class="fas fa-sync-alt" id="syncIcon"></i> Actualiser
            </button>
        </div>

        <div class="card">
            <table id="mappingTable">
                <thead>
                    <tr>
                        <th>Nom sur Glovo</th>
                        <th>Nom sur la Caisse</th>
                        <th>Prix Glovo</th>
                        <th>Prix Caisse</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
            <div id="empty-state">
                <i class="fas fa-box-open" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                <p>Aucun produit trouvé. Cliquez sur "Nouveau Produit" pour commencer.</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalTitle">Ajouter un produit</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <form id="mappingForm" onsubmit="saveMapping(event)">
                <input type="hidden" id="docId">
                <div class="form-group">
                    <label>Nom sur Glovo (Ex: Bocadillio Cheese)</label>
                    <input type="text" id="glovoName" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Nom sur la Caisse (Ex: Bocadillo Tortilla Cheese)</label>
                    <input type="text" id="caisseName" required autocomplete="off">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Prix Glovo (MAD)</label>
                        <input type="number" step="0.01" id="prixGlovo" value="0" required>
                    </div>
                    <div class="form-group">
                        <label>Prix Caisse (MAD)</label>
                        <input type="number" step="0.01" id="prixCaisse" value="0" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast">Opération réussie !</div>

    <script>
        const API_URL = 'https://firestore.googleapis.com/v1/projects/mon-bocadillo-menu/databases/(default)/documents/MenuMapping';
        let mappingsData = [];

        async function fetchMappings() {
            const syncIcon = document.getElementById('syncIcon');
            syncIcon.classList.add('fa-spin');
            
            try {
                // To get all documents, we can just GET the collection
                const response = await fetch(`${API_URL}?pageSize=1000`);
                const data = await response.json();
                
                mappingsData = [];
                if (data.documents) {
                    mappingsData = data.documents.map(doc => {
                        const fields = doc.fields;
                        return {
                            id: doc.name.split('/').pop(),
                            caisse: fields.caisse_name?.stringValue || '',
                            glovo: fields.glovo_name?.stringValue || '',
                            prix_caisse: fields.prix_caisse?.integerValue || fields.prix_caisse?.doubleValue || 0,
                            prix_glovo: fields.prix_glovo?.integerValue || fields.prix_glovo?.doubleValue || 0
                        };
                    });
                }
                
                renderTable();
            } catch (error) {
                console.error("Erreur de chargement:", error);
                showToast("Erreur de connexion", true);
            } finally {
                syncIcon.classList.remove('fa-spin');
            }
        }

        function renderTable(filterText = '') {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('empty-state');
            tbody.innerHTML = '';

            const filtered = mappingsData.filter(m => 
                m.glovo.toLowerCase().includes(filterText.toLowerCase()) || 
                m.caisse.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                filtered.forEach(m => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><span class="badge badge-glovo">${m.glovo}</span></td>
                        <td><span class="badge badge-caisse">${m.caisse}</span></td>
                        <td>${m.prix_glovo} MAD</td>
                        <td>${m.prix_caisse} MAD</td>
                        <td style="text-align: right;">
                            <button class="btn" style="padding: 0.3rem 0.6rem; margin-right: 0.5rem;" onclick="editMapping('${m.id}')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-danger" style="padding: 0.3rem 0.6rem;" onclick="deleteMapping('${m.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function filterTable() {
            const text = document.getElementById('searchInput').value;
            renderTable(text);
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Ajouter un produit';
            document.getElementById('mappingForm').reset();
            document.getElementById('docId').value = '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal(event) {
            if (event && event.target !== document.getElementById('modalOverlay')) return;
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function editMapping(id) {
            const mapping = mappingsData.find(m => m.id === id);
            if (mapping) {
                document.getElementById('modalTitle').innerText = 'Modifier le produit';
                document.getElementById('docId').value = mapping.id;
                document.getElementById('glovoName').value = mapping.glovo;
                document.getElementById('caisseName').value = mapping.caisse;
                document.getElementById('prixGlovo').value = mapping.prix_glovo;
                document.getElementById('prixCaisse').value = mapping.prix_caisse;
                document.getElementById('modalOverlay').classList.add('active');
            }
        }

        async function saveMapping(event) {
            event.preventDefault();
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;

            const oldId = document.getElementById('docId').value;
            const glovo = document.getElementById('glovoName').value;
            const caisse = document.getElementById('caisseName').value;
            const pGlovo = document.getElementById('prixGlovo').value;
            const pCaisse = document.getElementById('prixCaisse').value;

            // Generate ID based on Caisse name to match Node script logic
            const newId = encodeURIComponent(caisse.replace(/ /g, '_').replace(/[^\w-]/g, ''));

            const body = {
                fields: {
                    caisse_name: { stringValue: caisse },
                    glovo_name: { stringValue: glovo },
                    prix_caisse: { integerValue: parseInt(pCaisse) },
                    prix_glovo: { integerValue: parseInt(pGlovo) }
                }
            };

            try {
                // If it's an edit and the ID changed (name changed), delete the old one
                if (oldId && oldId !== newId) {
                    await fetch(`${API_URL}/${oldId}`, { method: 'DELETE' });
                }

                // Patch the document
                const patchUrl = `${API_URL}/${newId}`;
                await fetch(patchUrl, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                showToast("Produit enregistré avec succès");
                closeModal();
                fetchMappings();
            } catch (e) {
                console.error(e);
                showToast("Erreur lors de l'enregistrement", true);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function deleteMapping(id) {
            if (confirm("Voulez-vous vraiment supprimer ce mapping ?")) {
                try {
                    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    showToast("Produit supprimé");
                    fetchMappings();
                } catch (e) {
                    showToast("Erreur de suppression", true);
                }
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.background = isError ? 'var(--danger-color)' : 'var(--success-color)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Initial fetch
        fetchMappings();
    </script>
</body>
</html>
