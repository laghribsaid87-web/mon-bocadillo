<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Téléchargement - Mon Bocadillo</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Utilisation de Tailwind CSS pour un design rapide et moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .brand-yellow { background-color: #ffbc0d; }
        .brand-yellow-hover:hover { background-color: #e5a800; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Conteneur Principal -->
    <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-8 text-center border border-gray-100">
        <img src="/logo.png" alt="Mon Bocadillo" class="w-32 h-32 mx-auto mb-2 object-contain drop-shadow-sm">
        <h1 class="text-2xl font-black mb-1 text-gray-800">Mon Bocadillo</h1>
        <p class="text-gray-500 mb-8 text-sm font-medium">Portail de téléchargement officiel</p>

        <!-- Loading State -->
        <div id="loading" class="text-gray-400 mb-4 flex flex-col items-center justify-center gap-2">
            <div class="w-8 h-8 border-4 border-gray-200 border-t-yellow-500 rounded-full animate-spin"></div>
            <span class="text-xs mt-2">Recherche de la dernière version...</span>
        </div>

        <!-- Boutons de téléchargement (Cachés par défaut) -->
        <div id="buttons" class="space-y-4 hidden flex-col">
            <!-- Bouton APK (Livreur) -->
            <a id="btn-apk" href="https://github.com/laghribsaid87-web/mon-bocadillo/releases/latest" class="flex flex-col items-center justify-center w-full brand-yellow brand-yellow-hover text-black font-bold py-4 px-6 rounded-2xl shadow-sm transition-all transform hover:scale-[1.02] active:scale-95">
                <div class="flex items-center gap-2 text-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    App Livreur
                </div>
                <span class="text-[10px] font-normal opacity-80 mt-1">Pour les téléphones Android</span>
            </a>

            <!-- Bouton EXE (Caisse) -->
            <a id="btn-exe" href="https://github.com/laghribsaid87-web/mon-bocadillo/releases/latest" class="flex flex-col items-center justify-center w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-4 px-6 rounded-2xl shadow-sm transition-all transform hover:scale-[1.02] active:scale-95">
                <div class="flex items-center gap-2 text-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Caisse PC
                </div>
                <span class="text-[10px] font-normal opacity-70 mt-1">Logiciel Windows (.exe)</span>
            </a>
        </div>

        <!-- Version Affichée -->
        <p id="version-text" class="text-xs text-gray-400 mt-6 font-mono"></p>
    </div>

    <script>
        // Fetch latest release from GitHub API secretly
        fetch('https://api.github.com/repos/laghribsaid87-web/mon-bocadillo/releases/latest')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('buttons').classList.remove('hidden');
                document.getElementById('buttons').classList.add('flex');
                
                if(data && data.tag_name) {
                    document.getElementById('version-text').innerText = "Dernière version : " + data.tag_name;
                }
                if(data && data.assets) {
                    data.assets.forEach(asset => {
                        if (asset.name.endsWith('.apk')) document.getElementById('btn-apk').href = asset.browser_download_url;
                        if (asset.name.endsWith('.exe')) document.getElementById('btn-exe').href = asset.browser_download_url;
                    });
                }
            }).catch(err => { console.error("API error:", err); document.getElementById('loading').innerText = "Erreur de connexion."; });
    </script>
</body>
</html>
