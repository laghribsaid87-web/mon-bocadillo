<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Téléchargement - GoDroid Automator</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .brand-green { background-color: #00A082; }
        .brand-green-hover:hover { background-color: #00876E; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-8 text-center border border-gray-100">
        <img src="/logo.png" alt="Mon Bocadillo" class="w-32 h-32 mx-auto mb-2 object-contain drop-shadow-sm">
        <h1 class="text-2xl font-black mb-1 text-gray-800">GoDroid Automator</h1>
        <p class="text-gray-500 mb-8 text-sm font-medium">Application d'automatisation Glovo</p>

        <div id="loading" class="text-gray-400 mb-4 flex flex-col items-center justify-center gap-2">
            <div class="w-8 h-8 border-4 border-gray-200 border-t-green-500 rounded-full animate-spin"></div>
            <span class="text-xs mt-2">Recherche de la dernière version...</span>
        </div>

        <div id="buttons" class="space-y-4 hidden flex-col">
            <a id="btn-apk" href="#" class="flex flex-col items-center justify-center w-full brand-green brand-green-hover text-white font-bold py-4 px-6 rounded-2xl shadow-sm transition-all transform hover:scale-[1.02] active:scale-95">
                <div class="flex items-center gap-2 text-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Télécharger Automator
                </div>
                <span class="text-[10px] font-normal opacity-80 mt-1">Version pour tablette Android</span>
            </a>
        </div>

        <p id="version-text" class="text-xs text-gray-400 mt-6 font-mono"></p>
    </div>

    <script>
        fetch('https://api.github.com/repos/laghribsaid87-web/mon-bocadillo/releases')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('buttons').classList.remove('hidden');
                document.getElementById('buttons').classList.add('flex');
                
                if (data && data.length > 0) {
                    let automatorRelease = data.find(r => r.assets && r.assets.some(a => a.name.toLowerCase().includes('automator')));

                    if (automatorRelease && automatorRelease.assets) {
                        document.getElementById('version-text').innerText = "Version : " + automatorRelease.tag_name;
                        let apkUrl = '';
                        
                        automatorRelease.assets.forEach(asset => {
                            if (asset.name.toLowerCase().includes('automator') && asset.name.toLowerCase().endsWith('.apk')) {
                                apkUrl = asset.browser_download_url;
                            }
                        });
                        
                        if (apkUrl) {
                            document.getElementById('btn-apk').href = apkUrl;
                        }
                    } else {
                        document.getElementById('version-text').innerText = "Aucune version trouvée.";
                    }
                }
            }).catch(err => { console.error("API error:", err); document.getElementById('loading').innerText = "Erreur de connexion."; });
    </script>
</body>
</html>
