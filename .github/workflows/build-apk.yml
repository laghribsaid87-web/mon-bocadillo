name: Build GoDroid Automator APK

on:
  push:
    branches:
      - godroid-automator-app

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build APK (Android)
        run: gradle assembleDebug

      - name: Renommer l'APK pour la Release
        run: cp app/build/outputs/apk/debug/app-debug.apk GoDroid-Automator-v2.3.apk

      - name: Ajouter l'APK a la Release (Lien Direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.${{ github.run_number }}
          files: GoDroid-Automator-v2.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK pour le téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: GoDroid-Automator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
