name: Build Mon Bocadillo Livreur APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Clean compressed assets (Fix Duplicate resources)
        run: find dist -name "*.gz" -delete && find dist -name "*.br" -delete || true

      - name: Extract Version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Auto-increment Android Version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i -E "s/versionName \".*\"/versionName \"${{ steps.version.outputs.VERSION }}\"/g" android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK (Android)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug || (
            ./gradlew assembleDebug --stacktrace > ../error.log 2>&1
            curl -X POST -H "Content-Type: text/plain" --data-binary @../error.log https://webhook.site/ef147579-a881-4706-bc3f-8be709963c5e
            cat ../error.log
            exit 1
          )

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ERROR-LOG
          path: error.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Renommer l'APK pour la Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mon-Bocadillo-Livreur-v${{ steps.version.outputs.VERSION }}.apk

      - name: Ajouter l'APK a la Release (Lien Direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: Mon-Bocadillo-Livreur-v${{ steps.version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK pour le téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Bocadillo-Livreur-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    needs: build-android
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Build EXE (Windows)
        run: npx electron-builder --win --x64 --ia32 -p never

      - name: Extract Version
        id: version
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Ajouter l'EXE a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            out/*.exe
            release/*.exe
            dist/*.yml
            out/*.yml
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
