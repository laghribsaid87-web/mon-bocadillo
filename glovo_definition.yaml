    Promotion:
      type: object
      properties:
        promotion_id:
          type: string
          description: >
            Unique identifier of the promotion within a store address generated.
            If the promotion already exists with the same identifier, then only
            the enabled field will be updated. 

            Alternatively, by using the same identifier, a promotion can be
            toggled between enabled/disabled state. In this case, any updates
            other than the "enabled" field is ignored.
          example: promotion-identifier
        product_ids:
          type: array
          description: List of product ids to which the promotion applies.
          items:
            type: object
            properties:
              id:
                type: string
                description: >-
                  Unique identifier of the product within a store. If there is a
                  conflicting product, then new promo is created with disabled
                  status which is then activated when it is due
                example: burger1
              lowest_price_last_30_days:
                type: number
                format: double
                description: >
                  lowest price in the last 30 days for the product, to be
                  compliant with Omnibus directive in applicable countries
                  (Poland and Italy currently). 

                  If this field is not provided, Glovo will retrieve the lowest
                  price in the last 30 days using the data available to it in
                  applicable markets. For countries other than Poland and Italy,
                  this field can be ignored.
                example: '10.0'
            required:
              - id
        start_date:
          type: string
          format: date-time
          description: |
            Start date of the promotion.

            Custom dates, as provided:

            <table>
              <tr>
                <td>Start date</td>
                <td>End Date</td>
                <td>Resolution</td>
              </tr>
              <tr>
                <td>Provided</td>
                <td>Provided</td>
                <td>Custom dates, no logic required</td>
              </tr>
              <tr>
                <td>Not provided</td>
                <td>Provided</td>
                <td>Promotion starts instantly until end date provided</td>
              </tr>
              <tr>
                <td>Provided</td>
                <td>Not provided</td>
                <td>Promotion runs for one day on start date until 23:59 local time of the store</td>
              </tr>
              <tr>
                <td>Not provided</td>
                <td>Not provided</td>
                <td>Promotion runs for the current day (day of the request) until 23:59 local time of the store</td>
              </tr>
            </table>
          example: '2023-01-05 00:00:00'
        end_date:
          type: string
          format: date-time
          description: >
            End date of the promotion. For promotions with a single products, in
            case of overlapping promotion dates, the latest promotion will have
            priority. 

            The new promotion will start and the old promotion will stop
            immediately in this case. 

            For promotions with multiple products, in case of overlapping
            promotion dates, the promotion creation will fail and status will be
            informed via verify endpoint.
          example: '2023-01-22 00:00:00'
        enabled:
          type: boolean
          description: Specifies if the promotion is enabled.
          example: true
        type:
          type: string
          description: >
            Type of promotion. Allowed values are PERCENTAGE_DISCOUNT,
            FLAT_PRODUCT, TWO_FOR_ONE.


            PERCENTAGE_DISCOUNT: The promotion will apply a percentage discount
            to the product price.


            FLAT_PRODUCT: The promotion will apply a flat discount to the
            product price.


            TWO_FOR_ONE: The promotion will apply a buy one get one free
            discount to the product.When a product has this promotion applied,
            if a user adds this product to their basket, an additional quantity
            of the product is added to their basket automatically without any
            charge.
          example: PERCENTAGE_DISCOUNT
        parameters:
          type: array
          description: >
            List of parameters to be used for defining value information related
            to the "type" field.

            The keys should be one of the following: percentage,
            discounted_price.
          items:
            type: object
            description: |
              Allowed keys are percentage, discounted_price.
              Values must be double as strings.
            properties:
              percentage:
                type: string
                description: >-
                  Parameter used for defining value PERCENTAGE_DISCOUNT
                  promotion.
              discounted_price:
                type: string
                description: Parameter used for defining value FLAT_PRODUCT promotion.
          example:
            - percentage: '5'
        scheduled_times:
          type: object
          description: >
            Scheduled times to enable a promotion.

            The keys should be one of the following: "Monday", "Tuesday",
            "Wednesday", "Thursday", "Friday", "Saturday", "Sunday".
          example:
            Monday:
              - start: '06:00'
                end: '11:00'
          properties:
            week_day:
              type: array
              description: >-
                List of time ranges when the promotion is active on a specific
                day
              items:
                type: object
                properties:
                  start:
                    type: string
                    description: Start time of the promotion. Time format is 24hr.
                    example: '06:00'
                  end:
                    type: string
                    description: End time of the promotion. Time format is 24hr.
                    example: '11:00'
      required:
        - promotion_id
        - product_ids
        - enabled
        - type
    ModifiedOrder:
      type: object
      properties:
        order_id:
          allOf:
            - $ref: '#/components/schemas/OrderId'
        store_id:
          allOf:
            - $ref: '#/components/schemas/StoreId'
        order_time:
          type: string
          description: Local time of the acceptance of the order by Glovo
          format: yyyy-MM-dd HH:mm:ss
          example: '2018-06-08 14:24:53'
        estimated_pickup_time:
          type: string
          description: Local time of courier's expected arrival at the store
          format: yyyy-MM-dd HH:mm:ss
          example: '2018-06-08 14:45:44'
        utc_offset_minutes:
          type: string
          description: >-
            Time difference in minutes between UTC and the local time of the
            store
          format: int32
          example: '60'
        payment_method:
          type: string
          description: >
            - `CASH`: Indicates that the courier will pay for the order with
            cash


            - `DELAYED`: Indicates that Glovo will pay for the order by an
            invoice sent to the partner
          enum:
            - CASH
            - DELAYED
          example: CASH
        currency:
          type: string
          description: Currency code of the order
          example: EUR
        order_code:
          type: string
          description: >-
            Alphanumeric identifier of the order used for historical
            identification or by Glovo support
          example: BA7DWBUL
        allergy_info:
          type: string
          description: Customer provided details of their allergies
          example: I am allergic to tomato
        special_requirements:
          type: string
          description: >-
            Customer provided details of special requirements for the order (In
            case the store has this feature enabled, otherwise it will be null)
          example: Make sure there is no meat
        estimated_total_price:
          type: integer
          format: int32
          description: >-
            Estimated total price of products and attributes in the order
            denominated in cents and excluding the delivery fee
          example: 3080
        delivery_fee:
          type: integer
          format: int32
          description: >
            Delivery price of the order in cents. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be `null`
          example: null
        minimum_basket_surcharge:
          type: integer
          format: int32
          description: >
            The minimum basket surcharge in cents. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be `null`
          example: null
        customer_cash_payment_amount:
          type: integer
          format: int32
          description: >
            The total amount the customer will pay as cash. Relevant to
            [marketplace orders](#section/Getting-started/Marketplace-orders)
            only.


            If the order is delivered by Glovo or if this value is not informed
            by the customer, this will be set to `null`
          example: 5000
        courier:
          type: object
          description: Contains details of the assigned courier
          properties:
            name:
              type: string
              description: Courier name
              example: Flash
            phone_number:
              type: string
              description: Courier phone number with international prefix
              example: '+34666666666'
        customer:
          type: object
          description: Ordering customer's details
          properties:
            name:
              type: string
              description: Customer name
              example: Waldo
            phone_number:
              type: string
              description: >
                Customer phone number. Relevant to [marketplace
                orders](#section/Getting-started/Marketplace-orders) only.


                For Glovo orders this will be set to `"N/A"`
              example: N/A
            hash:
              type: string
              description: Unique identifier of the customer
              example: 11111111-2222-3333-4444-555555555555
            invoicing_details:
              type: object
              description: >-
                Customer invocing details (when provided). If not available this
                will be set to null`
              properties:
                company_name:
                  type: string
                  description: Company name
                  example: Acme Inc.
                company_address:
                  type: string
                  description: Address including city
                  example: 42 Wallaby Way, Sydney
                tax_id:
                  type: string
                  description: Tax ID
                  example: B12341234
        products:
          type: array
          minItems: 1
          description: List of order products
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the product within a store
                example: pd1
              purchased_product_id:
                type: string
                description: >
                  Unique identifier of every individual selection of a
                  (potentially customized) product within the order.

                  This identifier is necessary to perform order modifications
                  over the products purchased.
                example: A1
              quantity:
                type: integer
                format: int32
                description: Product quantity
                example: 2
              price:
                type: integer
                format: int32
                description: Product unit price (without attributes) in cents
                example: 1000
              name:
                type: string
                description: Product name
                example: Burger
              attributes:
                type: array
                minItems: 0
                description: Attributes associated with the given product
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique identifier of the attribute within a store
                      example: at1
                    quantity:
                      type: integer
                      format: int32
                      description: Attribute quantity
                      example: 2
                    price:
                      type: integer
                      format: int32
                      description: Attribute unit price in cents
                      example: 300
                    name:
                      type: string
                      description: Attribute name
                      example: Extra meat
                  required:
                    - id
                    - quantity
                    - price
                    - name
            required:
              - id
              - name
              - quantity
              - price
              - attributes
              - purchased_product_id
          example:
            - id: pd1
              purchased_product_id: A1
              name: Burger
              price: 1000
              quantity: 2
              attributes:
                - id: at1
                  name: Extra meat
                  price: 300
                  quantity: 1
                - id: at2
                  name: Water (33 cl)
                  price: 0
                  quantity: 1
                - id: at3
                  name: Tomato sauce
                  price: 0
                  quantity: 1
                - id: at4
                  name: Lettuce
                  price: 0
                  quantity: 1
            - id: pd2
              purchased_product_id: A2
              name: Ice cream
              price: 480
              quantity: 1
              attributes:
                - id: at5
                  name: Vanilla
                  price: 0
                  quantity: 1
                - id: at6
                  name: Small size
                  price: 0
                  quantity: 1
        delivery_address:
          type: object
          description: >
            Order delivery address details. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be set to `null`
          properties:
            label:
              type: string
              description: Complete delivery address including city
              example: 123 Fake Street, Gotham
            latitude:
              type: number
              format: double
              description: Address latitude
              example: 41.3971955
            longitude:
              type: number
              format: double
              description: Address longitude
              example: 2.2001737
        bundled_orders:
          type: array
          minItems: 1
          items:
            type: string
          description: >
            Bundled orders are those that are to be delivered together by a
            single courier. Relevant to Glovo orders only.


            For [marketplace
            orders](#section/Getting-started/Marketplace-orders) this will be
            set to `null`
          example:
            - order-id-1
            - order-id-2
        pick_up_code:
          type: string
          description: >-
            Non-sequential, non-unique 3 digit numerical code used to identify
            an order for pickup by the courier or customer
          example: '433'
        is_picked_up_by_customer:
          type: boolean
          description: >-
            Indicates that the order will be picked up by a customer instead of
            by a courier
          example: false
        cutlery_requested:
          type: boolean
          description: Indicates that the customer requested cutlery for the order
          example: true
        partner_discounts_products:
          type: integer
          format: int32
          description: >-
            Total value in cents of partner-funded promotional discounts applied
            to products
          example: 1550
        glovo_discounts_products:
          type: integer
          format: int32
          description: >-
            Total value in cents of glovo-funded promotional discounts applied
            to products
          example: 500
        partner_discounted_products_total:
          type: integer
          format: int32
          description: >-
            Total value in cents of products after partner-funded promotional
            discounts have been applied
          example: 1530
        discounted_products_total:
          type: integer
          format: int32
          description: >-
            Total value in cents of products after all promotional discounts
            have been applied
          example: 1030
        total_customer_to_pay:
          type: integer
          format: int32
          description: >
            The final amount to be paid in cents by customer after discounts,
            promotions, surcharges, fees and other adjustments have been
            calculated.


            Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be set to `null`
          example: null
        loyalty_card:
          type: string
          description: >
            Customer-provided store loyalty code. If the value is present, the
            Partner can choose to apply the corresponding rewards or discounts
            for the order to the identified loyalty customer.


            If the value is not provided by the customer this will be set to
            `null`
          example: CUSTOMER123
        voucher_code:
          type: string
          description: >
            Customer-provided store voucher code. If the value is present, the
            Partner can choose to apply the corresponding rewards or discounts
            for the order to the identified customer.


            If the value is not provided by the customer this will be set to
            `null`
          example: VOUCHER123
        service_fee:
          type: integer
          format: int32
          description: >
            Service fee of the order in cents. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If there is no service fee determined by Glovo, this field will be
            `null`
          example: 120
      required:
        - order_id
        - store_id
        - payment_method
        - currency
        - order_code
        - estimated_total_price
        - courier
        - customer
        - products
        - bundled_orders
        - is_picked_up_by_customer
        - partner_discounts_products
        - partner_discounted_products_total
        - service_fee
    OrderStatus:
      type: object
      properties:
        status:
          type: string
          description: >
            Use the following information to understand when to send each
            status:


            - `ACCEPTED`: The order has been accepted by the store. Be aware
            that if you don't accept the order we will still move forward with
            the order, as we don't require an acceptance to proceed.

            - `READY_FOR_PICKUP`: The order is ready to be picked up by a
            courier or the customer (Only available for orders delivered by
            Glovo couriers)

            - `OUT_FOR_DELIVERY`: The courier has collected the order in the
            store and is now being delivered to the customer (Only available for
            [Marketplace orders](#section/Getting-started/Marketplace-orders))

            - `PICKED_UP_BY_CUSTOMER`: The order has been picked up by the
            customer (Only available for orders to be picked up by the customer)
          enum:
            - ACCEPTED
            - READY_FOR_PICKUP
            - OUT_FOR_DELIVERY
            - PICKED_UP_BY_CUSTOMER
