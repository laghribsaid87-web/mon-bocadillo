    x-displayName: Orders
    description: >-
      These resources will allow you to make operations over orders for your
      stores.
  - name: Order-Lifecycle
    x-displayName: Order Lifecycle
    description: >-
      These resources will allow you to make operations over orders for your
      stores.
  - name: Notifications
    x-displayName: Notifications
    description: >-
      Whenever one of these events happen in Glovo, we will send you a
      notification to some of your [registered
      webhooks](#section/Getting-started/Event-notifications-using-webhooks).
  - name: Menu
    x-displayName: Menu
    description: >
      The menu represents how you organize the store content to be availabile
      for your customers. These resources will allow you to make operations over
      it, allowing you to re-organize items or even revamp your entire catalog
      of products.


      In order to understand the menu structure please refer to [Menu
      model](#tag/Menu-model)
  - name: Menu-items
