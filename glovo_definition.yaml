                  example: B12341234
        products:
          type: array
          minItems: 1
          description: List of order products
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the product within a store
                example: pd1
              purchased_product_id:
                type: string
                description: >
                  Unique identifier of every individual selection of a
                  (potentially customized) product within the order.

                  This identifier is necessary to perform order modifications
                  over the products purchased.
                example: A1
              quantity:
                type: integer
                format: int32
                description: Product quantity
                example: 2
              price:
                type: integer
                format: int32
                description: Product unit price (without attributes) in cents
                example: 1000
              name:
                type: string
                description: Product name
                example: Burger
              attributes:
                type: array
                minItems: 0
                description: Attributes associated with the given product
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique identifier of the attribute within a store
                      example: at1
                    quantity:
                      type: integer
                      format: int32
                      description: Attribute quantity
                      example: 2
                    price:
                      type: integer
                      format: int32
                      description: Attribute unit price in cents
                      example: 300
                    name:
                      type: string
                      description: Attribute name
                      example: Extra meat
                  required:
                    - id
                    - quantity
                    - price
                    - name
            required:
              - id
              - name
              - quantity
              - price
              - attributes
              - purchased_product_id
          example:
            - id: pd1
              purchased_product_id: A1
              name: Burger
              price: 1000
              quantity: 2
              attributes:
                - id: at1
                  name: Extra meat
                  price: 300
                  quantity: 1
                - id: at2
                  name: Water (33 cl)
                  price: 0
                  quantity: 1
                - id: at3
                  name: Tomato sauce
                  price: 0
                  quantity: 1
                - id: at4
                  name: Lettuce
                  price: 0
                  quantity: 1
            - id: pd2
              purchased_product_id: A2
              name: Ice cream
              price: 480
              quantity: 1
              attributes:
                - id: at5
                  name: Vanilla
                  price: 0
                  quantity: 1
                - id: at6
                  name: Small size
                  price: 0
                  quantity: 1
        delivery_address:
          type: object
          description: >
            Order delivery address details. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be set to `null`
          properties:
            label:
              type: string
              description: Complete delivery address including city
              example: 123 Fake Street, Gotham
            latitude:
              type: number
              format: double
              description: Address latitude
              example: 41.3971955
            longitude:
              type: number
              format: double
              description: Address longitude
              example: 2.2001737
        bundled_orders:
          type: array
          minItems: 1
          items:
            type: string
          description: >
            Bundled orders are those that are to be delivered together by a
            single courier. Relevant to Glovo orders only.


            For [marketplace
            orders](#section/Getting-started/Marketplace-orders) this will be
            set to `null`
          example:
            - order-id-1
            - order-id-2
        pick_up_code:
          type: string
          description: >-
            Non-sequential, non-unique 3 digit numerical code used to identify
            an order for pickup by the courier or customer
          example: '433'
        is_picked_up_by_customer:
          type: boolean
          description: >-
            Indicates that the order will be picked up by a customer instead of
            by a courier
          example: false
        cutlery_requested:
          type: boolean
          description: Indicates that the customer requested cutlery for the order
          example: true
        partner_discounts_products:
          type: integer
          format: int32
          description: >-
            Total value in cents of partner-funded promotional discounts applied
            to products
          example: 1550
        glovo_discounts_products:
          type: integer
          format: int32
          description: >-
            Total value in cents of glovo-funded promotional discounts applied
            to products
          example: 500
        partner_discounted_products_total:
          type: integer
          format: int32
          description: >-
            Total value in cents of products after partner-funded promotional
            discounts have been applied
          example: 1530
        discounted_products_total:
          type: integer
          format: int32
          description: >-
            Total value in cents of products after all promotional discounts
            have been applied
          example: 1030
        total_customer_to_pay:
          type: integer
          format: int32
          description: >
            The final amount to be paid in cents by customer after discounts,
            promotions, surcharges, fees and other adjustments have been
            calculated.


            Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be set to `null`
          example: null
        loyalty_card:
          type: string
          description: >
            Customer-provided store loyalty code. If the value is present, the
            Partner can choose to apply the corresponding rewards or discounts
            for the order to the identified loyalty customer.


            If the value is not provided by the customer this will be set to
            `null`
          example: CUSTOMER123
        voucher_code:
          type: string
          description: >
            Customer-provided store voucher code. If the value is present, the
            Partner can choose to apply the corresponding rewards or discounts
            for the order to the identified customer.


            If the value is not provided by the customer this will be set to
            `null`
          example: VOUCHER123
        service_fee:
          type: integer
          format: int32
          description: >
            Service fee of the order in cents. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If there is no service fee determined by Glovo, this field will be
            `null`
          example: 120
      required:
        - order_id
        - store_id
        - payment_method
        - currency
        - order_code
        - estimated_total_price
        - courier
        - customer
        - products
        - bundled_orders
        - is_picked_up_by_customer
        - partner_discounts_products
        - partner_discounted_products_total
        - service_fee
    ModifyPrice:
      type: object
      properties:
        price:
          type: number
          format: double
          description: >-
            The new price for the order. It is mandatory and must be greater
            than 0.
          example: 20.5
    TransactionId:
      type: object
      properties:
        transaction_id:
          type: string
          description: Unique identifier of the asynchronous operation
          example: a946a2c7-f4e7-46ac-ae63-8a5497cb0ad9
    MenuUploadStatus:
      type: object
      properties:
        transaction_id:
          type: string
          description: Unique identifier of the asynchronous operation
          example: a946a2c7-f4e7-46ac-ae63-8a5497cb0ad9
        status:
          type: string
          description: Current status of the menu update
          enum:
            - SUCCESS
            - PROCESSING
            - FETCH_MENU_INVALID_PAYLOAD
            - FETCH_MENU_SERVER_ERROR
            - FETCH_MENU_UNAUTHORIZED
            - NOT_PROCESSED
            - LIMIT_EXCEEDED
            - GLOVO_ERROR
            - SCHEDULE_CATALOG_DISABLED
          example: FETCH_MENU_INVALID_PAYLOAD
        last_updated_at:
          type: string
          description: Timestamp of the lastest menu status update
          example: '2020-03-24T10:03:49.614Z'
        details:
          type: array
          description: Details for the current menu status
          example:
            - >-
              Invalid section ["Menus"]: Section must contain at least one
              product
    ModifyProduct:
      type: object
      properties:
        price:
          type: number
          format: double
          description: >-
            The new product price in the store. If the value is not present or
            is null, it will not be updated.
          example: 10
        available:
          type: boolean
          description: >-
            Flag indicating if the product is available in the store. If the
            value is not present or is null, it will not be updated.
          example: true
    ModifyProductResult:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the attribute within a store
          example: burger1
        name:
          type: string
          description: Product name
          example: Burger Large
        price:
          type: string
          format: null
          description: Product price
          example: '10.0'
        image_url:
          type: string
          description: Url of the main product image. Must use HTTPS protocol.
          example: https://server.com/image
        description:
          type: string
          description: Product description
          example: A large cheeseburger
        available:
          type: boolean
          description: Specifies if the product is available to be purchased
          example: true
    ModifyAttribute:
      type: object
      properties:
        price_impact:
          type: number
          format: double
          description: >-
            The new attribute price in the store. If the value is not present or
            is null, it will not be updated.
          example: 1.5
        available:
          type: boolean
          description: >-
            Flag indicating if the attribute is available in the store. If the
            value is not present or is null, it will not be updated.
          example: true
    ModifyAttributeResult:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the attribute within a store
          example: side1
        name:
          type: string
          description: Attribute name
          example: French fries
        selected_by_default:
          type: boolean
          description: >-
            Specifies if the attribute should be selected by default when
            customizing the product associated
          example: true
        price:
          type: string
          format: null
          description: Attribute price
          example: '1.5'
        available:
          type: boolean
          description: Specifies if the product is available to be purchased
          example: true
    BulkUpdateItems:
      type: object
      properties:
        products:
          description: Products to be updated.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the product within a store
                example: burger1
              name:
                type: string
                description: Product name
                example: Burger Large
              price:
                type: number
                format: double
                description: Product price
                example: '10.0'
              image_url:
                type: string
                description: Url of the main product image. Must use HTTPS protocol.
                example: https://server.com/image
              available:
                type: boolean
                description: Specifies if the product is available to be purchased
                example: true
              quantity:
                type: integer
                description: >
                  **(Coming soon)** Product quantity. Field is optional. Accepts
                  positive integers (including 0). This field is supported for
                  some specific QC partners.
                example: '10'
        attributes:
          description: Attributes to be updated.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the attribute within a store
                example: side1
              name:
                type: string
                description: Attribute name
                example: French fries
              price_impact:
                type: number
                format: double
                description: Attribute price
                example: '1.5'
              available:
                type: boolean
                description: Specifies if the product is available to be purchased
                example: true
        promotions:
          description: |
            Promotions to be applied. This field is optional.
          type: array
          items:
            type: object
            properties:
              promotion_id:
                type: string
                description: >-
                  Unique identifier of the promotion within a store address
                  generated.
                example: promotion-identifier
              product_ids:
                type: array
                description: List of product ids to which the promotion applies.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique identifier of the product within a store.
                      example: burger1
                    lowest_price_last_30_days:
                      type: number
                      format: double
                      description: >-
                        Product lowest price within the last 30 days to comply
                        with omnibus directive. This field is optional.
                      example: '10.0'
                  required:
                    - id
              start_date:
                type: string
                format: date-time
                description: Start date of the promotion.
                example: '2023-01-05 00:00:00'
              end_date:
                type: string
                format: date-time
                description: End date of the promotion.
                example: '2023-01-05 00:00:00'
              enabled:
                type: boolean
                description: Specifies if the promotion is enabled.
                example: true
              type:
                type: string
                description: >-
                  Type of promotion. Allowed values are PERCENTAGE_DISCOUNT,
                  FLAT_PRODUCT, TWO_FOR_ONE.
                example: PERCENTAGE_DISCOUNT
              parameters:
                type: array
                description: >
                  List of parameters to be used for enriching information
                  related to the "type" field.

                  The keys should be one of the following: percentage,
                  discounted_price
                items:
                  type: object
                  description: |
                    Allowed keys are percentage, discounted_price.
                    Values must be double as strings.
                  properties:
                    percentage:
                      type: string
                      description: >-
                        Parameter used for enriching PERCENTAGE_DISCOUNT
                        promotion.
                    discounted_price:
                      type: string
                      description: Parameter used for enriching FLAT_PRODUCT promotion.
                example:
                  - percentage: '5'
              scheduled_times:
                type: object
                description: >
                  Scheduled times to enable a promotion.

                  The keys should be one of the following: "Monday", "Tuesday",
                  "Wednesday", "Thursday", "Friday", "Saturday", "Sunday".
                example:
                  Monday:
                    - start: '06:00'
                      end: '11:00'
                properties:
                  week_day:
                    type: array
                    description: >-
                      List of time ranges when the promotion is active on a
                      specific day
                    items:
                      type: object
                      properties:
                        start:
                          type: string
                          description: Start time of the promotion
                          example: '06:00'
                        end:
                          type: string
                          description: End time of the promotion
                          example: '11:00'
            required:
              - promotion_id
              - product_ids
              - enabled
              - type
    ProductStatus:
      type: object
      properties:
        externalId:
          type: string
          description: product identifier
        status:
          type: string
          enum:
            - PENDING_VALIDATION
            - VALID
            - INVALID
            - OMNIBUS_VIOLATION
          description: product validation state
    PromotionStatus:
      type: object
      properties:
        externalPromotionId:
          type: string
          description: promotion id sent by partner in the bulk update request
        status:
          type: string
          enum:
            - CREATED
            - UNMODIFIED
            - UPDATED_ENABLED
            - FAILED
            - PROCESSING
          description: current status of the promotion
        failureReason:
          type: string
          description: states the reason in case the promo status is failed
        products:
          type: array
          description: returns product validation status within a promo
          items:
            $ref: '#/components/schemas/ProductStatus'
    BulkUpdateItemsStatus:
      type: object
      properties:
        transaction_id:
          type: string
          description: Unique identifier of the asynchronous operation
          example: a946a2c7-f4e7-46ac-ae63-8a5497cb0ad9
        status:
          type: string
          description: Current status of the bulk update
          enum:
            - SUCCESS
            - PROCESSING
            - PARTIALLY_PROCESSED
            - NOT_PROCESSED
            - GLOVO_ERROR
          example: PARTIALLY_PROCESSED
        last_updated_at:
          type: string
          description: Timestamp of the lastest menu status update
          example: '2020-03-24T10:03:49.614Z'
        details:
          type: array
          description: Details for the current menu status
          example:
            - 'Products updated: [11111, 22222]'
            - 'Products not updated: [12345, 56789]'
            - 'Attributes updated: [33333, 44444]'
            - 'Attributes not updated: [67890, 45678]'
            - 'Promotions updated: [55555, 66666]'
            - 'Promotions not updated: [23456, 65432]'
        promotion_statuses:
          type: array
          items:
            $ref: '#/components/schemas/PromotionStatus'
          description: returns detailed promotion status
    PackagingTypes:
      type: object
      properties:
        packaging_type:
          description: Valid types of packaging
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: Unique identifier of the packaging type
                example: 2
              type_name:
                type: string
                description: Name of the packaging type
                example: recyclable
              is_eco:
                type: boolean
                description: Specifies if the packaging is eco-friendly
                example: true
              is_returnable:
                type: boolean
                description: Specifies if the packaging is returnable
                example: false
              min_price:
                type: number
                format: double
                description: Minimum price of the packaging type
                example: 0
              max_price:
                type: number
                format: double
                description: Maximum price of the packaging type
                example: 1
              currency:
                type: string
                description: Currency of the price
                example: EUR
    Menu-2:
      type: object
      properties:
        attributes:
          type: array
          minItems: 0
          description: >
            A product can be customized in different ways e.g. add mayonnaise,
            bundle it with a drink, or add extra meat. 

            Each of these customizations is considered an attribute. It is not
            mandatory for a product to have attributes. 

            Each attribute can have a different price impact. Similar attributes
            are grouped into attribute groups. 


            Please note: to represent combos and cross-selling options, use the
            dedicated fields below.
          items:
            type: object
            properties:
              id:
                type: string
                description: >-
                  Unique identifier of the attribute within a store. Attributes
                  with the same `id` must only be created once or the menu will
                  be rejected.
              name:
                type: string
                description: Attribute name
              price_impact:
                type: number
                format: double
                description: >-
                  Attribute price, if price is lower than 0 it will be changed
                  to 0
              selected_by_default:
                type: boolean
                description: >-
                  Specifies if the attribute should be selected by default when
                  customizing the product associated
              available:
                type: boolean
                description: Specifies if the attribute is available to be purchased
            required:
              - id
              - price_impact
              - selected_by_default
        attribute_groups:
          type: array
          minItems: 0
          description: >
            Attribute groups allow to group similar customizations into generic
            groups. Each attribute group can have a minimum and maximum of
            choices for the customer.

            Examples of attribute groups could include:

            - Sauces: a group of attributes such as mayo, mustard or tomato
            sauce

            - Drinks: a group of attributes such as water, coke, or lemonade


            Please note: to represent combos and cross-selling options, use the
            dedicated fields below.
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the attribute group within a store
              name:
                type: string
                description: Attribute group name
              min:
                type: integer
                format: int32
                description: Minimum attributes a customer can choose from the group
              max:
                type: integer
                format: int32
                minimum: 1
                description: >-
                  Maximum attributes a customer can choose from the group, needs
                  to be bigger or equal than min
              collapse:
                type: boolean
                description: >-
                  Indicates whether the list of attributes within the group will
                  be displayed as collapsed by default in the customer apps
              multiple_selection:
                type: boolean
                description: >-
                  Indicates if the customer can choose more than one attribute
                  from the group
              attributes:
                type: array
                minItems: 1
                items:
                  type: string
                description: >-
                  List of attribute unique identifiers that would be part of the
                  group. Attributes will be displayed in the order of the list.
                  Attribute identifiers must refer to the `id` of existing
                  `attribute` elements, otherwise payload will be considered
                  invalid.
            required:
              - id
              - name
              - min
              - max
              - collapse
              - multiple_selection
              - attributes
        products:
          type: array
          minItems: 1
          description: >
            A product is the main component of a Glovo menu. It usually
            represents a physical product in a store, although we give stores
            flexibility to configure what they want to offer as products.

            Products included here should:

            - Either belong to a section

            - Or be part of a combo group
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the product within a store
              name:
                type: string
                description: Product name
              price:
                type: number
                format: double
                description: >-
                  Product price, if price is lower than 0 it will be changed to
                  0
              image_url:
                type: string
                format: uri
                description: Url of the main product image. Must use HTTPS protocol.
              extra_image_urls:
                type: array
                minItems: 0
                items:
                  type: string
                description: >
                  Array of urls of product extra images. Must use HTTPS
                  protocol. 

                  They will be displayed in the product detail page in the same
                  order as in the array, and always after the main image.

                  Support up to 9 images (if more images are sent, the first 9
                  will be processed).
              restrictions:
                type: object
                properties:
                  is_alcoholic:
                    type: boolean
                    description: Flag indicating if the product is an alcoholic beverage.
                  is_tobacco:
                    type: boolean
                    description: Flag indicating if the product is a tobacco product.
                description: >
                  Optional field to indicate if the product has any
                  restriction. 

                  It has some implications in some flows, e.g, This will trigger
                  a compliant user flow for alcohol restriction for stores in
                  Poland and Romania and for tobacco in Morocco.
              description:
                type: string
                description: Product description
              attributes_groups:
                type: array
                minItems: 0
                items:
                  type: string
                description: >-
                  List of attribute group unique identifiers that would be part
                  of the product. Attribute groups will be displayed in the
                  order of the list.
              available:
                type: boolean
                description: Specifies if the product is available to be purchased
              combo_groups:
                type: array
                minItems: 0
                description: >
                  **(Coming soon to production, available for testing in
                  stage)** List of combo groups encapsulating combo items.
                items:
                  type: object
                  required:
                    - name
                    - min
                    - max
                    - multiple_selection
                    - combo_items
                  properties:
                    name:
                      type: string
                      description: Combo group name visible to the users.
                    min:
                      type: integer
                      format: int32
                      description: >-
                        Minimum number of combo items a customer can choose from
                        the group.
                    max:
                      type: integer
                      format: int32
                      description: >-
                        Maximum number of combo items a customer can choose from
                        the group.
                    multiple_selection:
                      type: boolean
                      description: >-
                        Whether the customer can choose more than one combo item
                        from the combo group.
                    combo_items:
                      type: array
                      minItems: 1
                      description: List of combo items.
                      items:
                        type: object
                        required:
                          - product_id
                          - surcharge
                        properties:
                          product_id:
                            type: string
                            description: Reference to a standalone product.
                          surcharge:
                            type: number
                            format: double
                            description: >-
                              Surcharge on top of the standalone product's
                              price.
              cross_selling_options:
                type: array
                minItems: 0
                description: List of cross-selling options.
                items:
                  type: object
                  required:
                    - name
                    - products
                  properties:
                    name:
                      type: string
                      description: Name of the cross-selling options group.
                    products:
                      type: array
                      minItems: 1
                      description: List of references to standalone products.
                      items:
                        type: string
              dietary_labels:
                type: array
                minItems: 0
                items:
                  type: string
                description: >-
                  List of dietary labels that apply to the product. Available
                  labels (VEGAN, VEGETARIAN, GLUTEN_FREE, LACTOSE_FREE, HEALTHY,
                  HALAL, KOSHER)
              packaging:
                type: string
                description: |
                  Packaging ID for the product
            required:
              - id
              - name
              - price
        collections:
          type: array
          minItems: 1
          description: >
            A collection is the main categorization of a Glovo menu. It is
            mandatory to have at least one collection in your menu. It is
            composed by sections and it must have at least one to contain other
            elements. 

            Some examples of collections include: Drinks, Burgers, Salads,
            Desserts, Pasta.
          items:
            type: object
            properties:
              name:
                type: string
                description: >-
                  Collection name. It should be unique as it will serve as
                  identifier of the collection.
              position:
                type: integer
                format: int32
                description: Relative position of the collection in the menu
              image_url:
                type: string
                format: uri
                description: Url of the collection image. Must use HTTPS protocol.
              sections:
                type: array
                minItems: 1
                description: >
                  A section is a subdivision within a collection. Any collection
                  must contain at least one section with at least one product
                  associated. One section can include up to 200 products.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Section name
                    position:
                      type: integer
                      format: int32
                      description: Relative position of the section in the collection
                    products:
                      type: array
                      minItems: 1
                      items:
                        type: string
                      description: >-
                        List of products unique identifiers that would be part
                        of the section. Products will be displayed in the order
                        of the list.
                  required:
                    - name
                    - products
            required:
              - name
              - sections
        supercollections:
          type: array
          minItems: 0
          description: >
            A super collection is the uppermost categorization of a Glovo menu.
            Super collections are not required.

            If at least one exists, a list of all the super collections is
            displayed to customers when they open a store in the app. Otherwise,
            the collection is displayed as the uppermost categorization.
          items:
            type: object
            properties:
              name:
                type: string
                description: Super collection name
              position:
