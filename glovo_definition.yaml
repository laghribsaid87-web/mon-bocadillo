      Representation of an order whose products were modified.

      <SchemaDefinition schemaRef="#/components/schemas/ModifiedOrder" />
  - name: Loyalty-Membership-Validation
    x-displayName: Loyalty Membership Validation
    description: >
      ## Static validation

      Glovo performs a format validation as a first filer at the moment the
      customer inputs the loyalty card id in the app. 


      Validations can be: 

      - Digits validation (min X and max Y digits)

      - Phone number validation

      - Email validation


      In order to configure a static validation please reach out to your AM.


      <div align="center" class="img-div">
        <img alt="product image 1" src="img/loyalty_validation.png#center" />
      </div>
  - name: Rate-limit
    x-displayName: Rate Limit
    description: |
      Set as 120 requests per minute.
        - Applicable as sum of all API requests made per store address ID
        - Any requests exceeding the rate limit will automatically fail with a 429 response status
  - name: Versioning
    x-displayName: Versioning
    description: >
      <div class="alert-box warn">
        <i data-feather="alert-triangle"></i>
        It is important to <b>not apply strict validation</b> to any JSON we send to your webhooks! As new changes may break your integration.
      </div>



      The API is currently evolving as we add new features for partners and
      integrators. It’s important that you are aware that **non-breaking
      changes** might be introduced at any time without previous notice. Here is
      a list of non-breaking changes Glovo can introduce and your integration
      should support:
        - Adding a new endpoint
        - Adding a new optional field in a request body
        - Setting a previously required field in a request to optional
        - Changing error messages from responses
        - Adding field in any notification to your webhooks



      On the other hand, Glovo also can introduce **breaking changes** at any
      time. These changes will come with a previous notice and a provided amount
      of time will be granted to you to comply with them. Breaking changes might
      include:
        - Deprecating an endpoint
        - Adding a new required field in a request body
        - Renaming a field in a request body
        - Setting a previously optional field in a request to required
  - name: Frequently-Asked-Questions
    x-displayName: Frequently Asked Questions
    description: >
      ## General questions

      **How can I test orders on the Staging website?**


      Firstly create a user login for [testglovo.com](https://testglovo.com) as
      explained in the first section of this webpage.

      Then you will be able to make orders using the Customer website by
      entering the store and selecting some products. If you would like to test
      credit cards, you can use one of these [fake
      cards](https://docs.processout.com/testing/#test-cards), Cash or DotPay to
      check out.

      ## Authentication on the public Glovo API

      **Access token (shared token):  Do we use the same token for the duration
      of the integration or must  a new token be obtained prior to each
      request?**


      Access token is static for each environment and webhook. That means you
      are going to have one token for the Test Environment and another token
      once the integration goes Live in the Production Environment.

      The same token will be used for all the stores configured.


      **What is the IP from which Glovo will send orders?**


      The Glovo backend runs from multiple machines. There won’t be a unique IP.
      If it’s a matter of whitelisting the traffic coming from Glovo, this can
      potentially be done by whitelisting us by the Authorization header, which
      is where we include the shared token.


      ## Order workflow

      **If we already have a Glovo device (tablet, Sunmi) to handle orders in
      our store, can we completely replace it with our solution? **


      Yes. The Partner Webapp that our devices use have the same functionalities
      to manage the order workflow as our API endpoints, but the integration
      does not replace our Webapp 100%. Reporting an incident with a courier,
      requesting bags, sending a message to Glovo Support, changing the
      schedule, etc must be done through the Webapp.


      **Can we keep Glovo’s device (webapp, sumni) just in case?**


      Yes. You can keep our devices and have them in case your solution fails.


      **How can we accept or refuse Glovo’s order trough the API?**


      - Orders can be accepted using the Order Status endpoint:
      `https://api.glovoapp.com/webhook/stores/<YOUR-STORE-ID>/orders/<ORDER-ID>/status`

      - Refuse: We send the notification about canceled orders to the endpoint
      you provide us, and will not expect an answer from your side. **It is not
      possible to cancel or refuse orders via the API or via our Webapp**.
      You’ll need to call the client or our support to cancel an order.


      **Accept: Do orders need to be accepted on the "Partner Webapp" first
      before they are sent to our picking solution?**


      When an order is created, the notification is sent in both ways to the
      Partner Webapp and the endpoint you shared for Order Creation. We would
      like to be informed when the order is accepted. It must be done via the
      API. If this is not possible, the store can be configured to auto-accept
      orders automatically, but this would have operational implications (riders
      would be immediately dispatched to your store, even if you didn’t start
      the picking process).


      ## Order Structure

      **store_id - Identifier of the store on the Partner side: is this the
      store ID from our software or the store id provided by Glovo to the
      restaurant ? **


      This Store ID is the one provided by you. This ID helps Glovo and you to
      direct orders to the correct store and allows you to send product updates
      to each store. This ID must be unique per integration (authentication
      token/webhook). Internally, we call this the External ID.


      **payment_method: how should each option be interpreted on our POS?**


      This field refers to the way Glovo pays the Partner.

      - CASH: the courier will pay the Partner when picking up the order (either
      by cash or card)

      - DELAYED:  Order will be paid through the Glovo invoice

      This field is **not** related to how the user has paid the Courier, it is
      related to how Glovo pays the Partner.


      **While Testing, I checked out using CASH but received payment_method:
      DELAYED. Why is this? Can I test the CASH payment method in the test
      environment? **


      What you selected as a User when making the order is not related to how
      Glovo pays the store. What the customer selects when checking out is only
      related to how the customer pays the courier.

      In the test environment, we will always send DELAYED as the payment
      method.


      **Order_code - what is this for and why is it different from order_id?**


      - Order_code is the identifier that the store and customer/partner Support
      use when identifying the order. It’s used only to give customer/courier
      support and is the code that appears in the invoice.

      - Order_id is the unique identifier of the order in Glovo systems.


      **Pick_up_code - what is this for?**


      This is a 3 digit non-unique code for Couriers to pick up the right order.
      It should be displayed in a visible location on the picking solution to
      aid order dispatching.


      **Estimated_total_price - includes taxes and delivery fee? **


      Taxes on products yes; delivery fee no.


      **Delivery_fee - includes taxes?**


      Yes. But this delivery fee is only sent to Marketplace (Gen1) Partners who
      carry out deliveries using their own couriers rather than Glovo’s. For
      Partners who use Glovo couriers this fee will be null.


      **Minimum_basket_surcharge - what is this for?**


      This field is only for Marketplace (Gen1) Partners, who use their own
      couriers for delivery.


      **Bundled_orders - what is this for? **


      Bundling refers to a courier being able to pick up and deliver two orders
      from the same location to two different users  in order to be more
      efficient. The bundled order field shows the 2 order ids that the courier
      will pick up together. These orders should be prepared at the same time
      for efficiency.


      ## Order cancellations

      **Can an order be canceled, if so who can trigger order cancellation ?**


      A Partner can cancel only by calling our customer support via phone. Glovo
      or the customer can also cancel an order. In all 3 cases, we send the
      order cancellation if the cancellations endpoint is configured.

      Here are the cancellation possibilities (from the documentation) that we
      send in the order cancellation object:
        - USER_ERROR: Customer cancellation
        - PRODUCTS_NOT_AVAILABLE: Products were not available in store
        - PARTNER_PRINTER_ISSUE: Order canceled due to printer issue
        - STORE_CAN_NOT_DELIVER: Order could not be delivered by partner
        - ORDER_NOT_FEASIBLE: Order not feasible due to Glovo internal reasons such as saturation
        - OTHER

      **How do we cancel an order? Will there be any option in the future API
      versions to cancel orders?**


      We do not have an endpoint for the Partner to cancel an order. In order to
      cancel an order, the Partner must call the client or our Customer Service
      phone number.


      **cancellation notification endpoint: Do we need a separate cancellation
      endpoint or can it be the same as the orders endpoint?**


      It can be the same or separate. The authentication token will be the same
      as for Orders.


      **What are the expected responses from our Order Cancellation webhook?**


      No response is expected.


      **What is the payment_strategy?**


      It depends on the type of store and the moment of the cancellation. Please
      ask the Glovo Account Manager assigned to the partner about the specific
      case for your stores.


      **I’m not receiving order cancellation notifications in Production**


      - Confirm that you provided a cancellations endpoint URL and that the
      endpoint was programmed

      - Confirm that you have accepted the order. If the order is not accepted,
      you will not receive the cancellation notification


      ## Order Modification

      **What does order modification do?**


      If one of the products ordered is out of stock, the Partner can contact
      the User and propose a substitution. If the Customer agrees, the order can
      be modified using this endpoint with the agreed upon modifications (remove
      product, replace product, add product, or remove quantities from the
      product).


      **I don’t receive the Customer contact information, how can the Store
      contact the Customer to agree to a modification?**


      To enable the customer contact information, you’ll need to sign a DPA and
      NDA contracts. Once you’ve signed them, you can contact us and we’ll
      enable this information.



      **Is there a limit to the number of products that can be added to an order
      in the order_modification?**


      We implemented a simple rule that allows for flexibility for small orders,
      while capping large orders proportionately to original size:
        - All modified orders can contain up to 5 products regardless of original product total quantity
        - If the modified order quantity is above 5, it must be within 200% of the original order product quantity e.g. if the original order product quantity is 4, the new quantity can have up to 8

      ## Order Status Update

      **Is it required to send these statuses? **


      Yes. If we receive this status via API it automates the process for the
      Partner, gives us a better understanding of preparation time and helps us
      give an accurate ETA to the Customer.


      **Do I have to send both Ready for Pickup and Out for Delivery for each
      order?**


      No, we expect only to receive the READY_FOR_PICKUP status once you’ve
      finished the picking process.


      **I’m sending Accept status and receiving an error message: "Status
      ACCEPTED invalid, this order has been already accepted"**


      Either that order has been accepted already via the API or the Webapp. Its
      also possible that the store is set to Auto-accept orders. If you would
      like to send Accept via the API please contact us and we will disable
      Auto-accept.


      ## Promotion creation

      **How does Glovo treat promotion creation requests received with start
      date and end date(either one or both) not provided?**


      The behavior is detailed in the table below.


      <table>
        <tr>
          <td>Start date</td>
          <td>End Date</td>
          <td>Resolution</td>
        </tr>
        <tr>
          <td>Provided</td>
          <td>Provided</td>
          <td>Custom dates, no logic required</td>
        </tr>
        <tr>
          <td>Not provided</td>
          <td>Provided</td>
          <td>Promotion starts instantly until end date provided</td>
        </tr>
        <tr>
          <td>Provided</td>
          <td>Not provided</td>
          <td>Promotion runs for one day on start date until 23:59 local time of the store</td>
        </tr>
        <tr>
          <td>Not provided</td>
          <td>Not provided</td>
          <td>Promotion runs for the current day (day of the request) until 23:59 local time of the store</td>
        </tr>
      </table>


      **What happens when Glovo gets a promotion request for a product which
      already has a promotion active?**


      In this case, if the promotion is created with multiple products (multiple
      products in 1 promotion ID), we will fail the new promotion request and
      the already existing promotion continues to be active.


      If the promotion is created with a single product (1 product in 1
      promotion ID), we treat the latest request as the active promotion and
      deactivate the earlier promotion.


      Below are some scenarios.


      Scenario 1: No overlap of dates


      On Jan 1, Promotion P1 is active on product A1 with 5% off (start date 1
      Jan, end date 10 Jan). We receive a new request for Promotion P2 on
      product A1 on 6th Jan with 10% off (start date 15th Jan, end date 30 Jan).
      We will continue running  promotion P1 until its end date 10th Jan. On
      15th Jan, promotion P2 starts.


      Scenario 2: Overlap of dates


      On January 1, Promotion P1 is active on product A1 with 5% off (start date
      1 Jan, end date 10 Jan). We receive a new request for Promotion P2 on
      product A1 on 6th Jan with 10% off (start date 6th Jan, end date 15 Jan).
      We will deactivate promotion P1 and activate promotion P2 in this
      case.      



      ## Status Codes & Error Codes

      **Which status code is Glovo expecting on new order submission ?**


      200 OK


      **What happens when Glovo receives an error code?**


      No action is taken. We assume the Partner will prepare the order.


      **What is the timeout value set by Glovo? How long does your server wait
      for a response?  Can this value be changed?**


      10 seconds. We cannot modify this value.


      **Is there a retry logic on Glovo if our server times out?**


      Yes. The order notification retry mechanism is a process in which an
      initially failed order notification is re-sent several more times, to
      improve the number of notifications successfully reaching our partners.
      This process applies for all current types of order notifications: order
      dispatched, order picked up and order canceled. We define a failed order
      notification as an order notification HTTP request sent to the your
      endpoint, to which either did not send any response within 10 seconds of
      the request being sent, or sent a response with a HTTP status code other
      than 2xx


      **What happens if there is a failure processing the new notification
      event, is there any alternative to notify the store of the order?**


      The Partner will receive orders on the Partner Webapp regardless of
      whether they are integrated or not. If the Store is programmed to
      “Auto-accept: false” they will have to accept orders on the Webapp. If the
      Store is configured to “Auto-accept: true”, orders will automatically be
      accepted and appear in the Accepted section of the Webapp.
