  /webhook/stores/{storeId}/closing:
    put:
      tags:
        - Scheduling
      summary: Close temporaly
      description: >-
        Allows you to close a store temporarily until a specified date and time
        in the future. This will ignore the opening times defined in the store
        schedule, forcing the store to be closed until the specified date and
        time.
      operationId: Close-temporaly
      parameters:
        - name: storeId
          in: path
          description: >
            [Unique identifier of the
            store](#section/Getting-started/Unique-identifier-of-the-store)
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          description: Specify that the content will be sent as JSON
          required: true
          schema:
            type: string
            default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: string
                  description: >-
                    A date-time in the future with an offset from UTC/Greenwich
                    in the ISO-8601 calendar system.
                  example: '2019-12-20T10:00:00+01:00'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --request PUT \
                 --url https://api.glovoapp.com/webhook/stores/{storeId}/closing \
                 --header 'Authorization: <your-secret-token>' \
                 --header 'content-type: application/json' \
                 --data '{
                    "until": "2019-12-20T10:00:00+01:00"
                 }'
      responses:
        '204':
          description: Successful operation
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
      security:
        - token: []
    get:
      tags:
        - Scheduling
      summary: Last temporary closing
      description: Allows you to get the last store temporary closure.
      operationId: Active-temporary-closing
      parameters:
        - name: storeId
          in: path
          description: >
            [Unique identifier of the
            store](#section/Getting-started/Unique-identifier-of-the-store)
          required: true
          schema:
            type: string
      x-codeSamples:
        - lang: Curl
          source: |
            curl --request GET \
                 --url https://api.glovoapp.com/webhook/stores/{storeId}/closing \
                 --header 'Authorization: <your-secret-token>'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  until:
                    type: string
                    description: >-
                      A date-time with an offset from UTC/Greenwich in the
                      ISO-8601 calendar system.
                    example: '2019-12-20T10:00:00+01:00'
      security:
        - token: []
    delete:
      tags:
        - Scheduling
      summary: Remove temporary closing
      description: >-
        Allows you to remove an active temporary closure for a store. After the
        removal, the store will continue following their regular schedule.
      operationId: Remove-close-temporaly
      parameters:
        - name: storeId
          in: path
          description: >
            [Unique identifier of the
            store](#section/Getting-started/Unique-identifier-of-the-store)
          required: true
          schema:
            type: string
      x-codeSamples:
        - lang: Curl
          source: |
            curl --request DELETE \
                 --url https://api.glovoapp.com/webhook/stores/{storeId}/closing \
                 --header 'Authorization: <your-secret-token>'
      responses:
        '204':
          description: Successful operation
      security:
        - token: []
