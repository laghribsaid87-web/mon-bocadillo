  /webhook/stores/{storeId}/menu:
    post:
      tags:
        - Menu
      summary: Upload menu
      description: >
        Allows you to upload or update the entire menu of a store in Glovo.


        This process is asynchronous, so we will provide a `transaction_id` to
        follow the process with the [Verify menu upload
        endpoint](#operation/Verify-upload-menu)


        <div align="center">
          <img alt="menu flow" src="img/menu_update_process.png#center" />
        </div>


        <div class="alert-box info">
          <i data-feather="info"></i>
          There is a maximum number of 5 of menu updates allowed per day per store address. For small products and attributes updates please use the individual or bulk endpoints.
        </div>


        <div class="alert-box info">
          <i data-feather="info"></i>
          No negative prices are allowed for products or attributes. Negative prices in products and attributes will be changed to 0
        </div>


        <div class="alert-box info">
          <i data-feather="info"></i>
          All attribute identifiers added in `attribute_groups[].attributes` must refer to existing `attribute.id`, otherwise the menu will be rejected. 
        </div>


        <div class="alert-box info">
          <i data-feather="info"></i>
          Attributes with the same `id` must only be created once or the menu will be rejected. 
        </div>


        In case the limit is reached we will return status code 429 (too many
        requests).


        If for some reason the Glovo system fails while updating, no changes
        will be made at all to avoid inconsistencies.
      operationId: Upload-menu
      parameters:
        - name: storeId
          in: path
          description: >
            [Unique identifier of the
            store](#section/Getting-started/Unique-identifier-of-the-store)
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          description: Specify that the content will be sent as JSON
          required: true
          schema:
            type: string
            default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                menuUrl:
                  type: string
                  description: >
                    URL to a JSON resource following the format specified in
                    [Menu model](#tag/Menu-model).


                    We will request the JSON resource sending the header
                    `Authorization: Bearer your-secret-token`


                    It is important that all the URL can be accessible from any
                    IP address.
                  example: https://yourserver.json/path-to-your-menu.json
                  required: true
      x-codeSamples:
        - lang: Curl
          source: |
            curl --request POST \
                 --url https://api.glovoapp.com/webhook/stores/{storeId}/menu \
                 --header 'Authorization: <your-secret-token>' \
                 --header 'content-type: application/json' \
                 --data '{
                    "menuUrl": "https://yourserver.json/path-to-your-menu.json"
                 }'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionId'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '429':
          description: Too many requests
      security:
        - token: []
  /webhook/stores/{storeId}/menu/{transactionId}:
    get:
      tags:
        - Menu
      summary: Verify menu upload
      description: >

        Allows you to check the status of the menu update process in Glovo for a
        particular `transaction_id`.


        <strong>Keep in mind the status is only saved for 24 hours since the
        ingestion is triggered.</strong>


        These are the possible status:


        * `SUCCESS`: The menu update process finished successfully

        * `PROCESSING`: The menu update process has not finished yet

        * `FETCH_MENU_INVALID_PAYLOAD`: The menu update process finished with
        errors caused by invalid JSON input

        * `FETCH_MENU_SERVER_ERROR`: The menu update process finished with
        errors trying to download the menu from the partner URL (eg. time-out,
        invalid URL, etc.)

        * `FETCH_MENU_UNAUTHORIZED`: The menu update process finished with
        errors trying to download the menu from the partner URL (eg.
        authorization errors)

        * `NOT_PROCESSED`: The menu update process finished with errors due to
        incorrect integration setup

        * `LIMIT_EXCEEDED`: The maximum number of menu updates allowed per day
        per store address was exceeded

        * `GLOVO_ERROR`: The menu update process finished unsuccessfully due to
        an error in the Glovo system

        * `SCHEDULE_CATALOG_DISABLED`: The menu update process finished with
        errors because the store associated to this store address doesn't have
        the schedule catalog feature enabled, but a schedule is being uploaded


        If the status indicates an error, we will send additional information to
        help you understand the cause.


        <div class="alert-box info">
          <i data-feather="info"></i>
          If the status of your menu update is <code>NOT_PROCESSED</code> or <code>GLOVO_ERROR</code>, please contact your account manager for support.
        </div>
      operationId: Verify-upload-menu
      parameters:
        - name: storeId
          in: path
          description: >
            [Unique identifier of the
            store](#section/Getting-started/Unique-identifier-of-the-store)
          required: true
          schema:
            type: string
        - name: transactionId
          in: path
          description: Unique identifier of the menu update transaction to follow
          required: true
          schema:
            type: string
      x-codeSamples:
        - lang: Curl
          source: |
            curl --request GET \
                 --url https://api.glovoapp.com/webhook/stores/{storeId}/menu/{transactionId} \
                 --header 'Authorization: <your-secret-token>'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuUploadStatus'
        '404':
          description: Invalid transaction ID
      security:
        - token: []
