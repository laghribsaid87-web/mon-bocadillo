  /{partner-endpoint}:
    post:
      tags:
        - Loyalty-Membership-Validation
      summary: Real time validation
      description: >
        We’ve enabled a way for the partners to validate the card IDs uploaded.
        This means at the moment a customer uploads a loyalty card ID in the
        Glovo-app we will instantly validate with the partner if the ID exists
        or not.


        This process will be executed through webhooks.


        Steps to enable

        1. Reach out to your AM.

        2. Partner will build a POST API (see technical description below)

        3. Partner has to share the URL to the AM.

        4. AM will configure host and endpoint and execute a test over the API
        to confirm it is successfully linked (200 response)

        5. AM will confirm the webhook was successfully linked and the
        integration is finished. Partner will now execute real-time validations
        of the card IDs.



        ### Security 

        All communication will be over https only.

        If partner wants, we can offer the IPs where the requests will be coming
        from, to enable a whitelisting policy

        We also send the timestamp inside the payload, if the partners would
        like to avoid replay requests by allowing only requests that are not
        older than some time (a minute for example)

        For authentication, Glovo will sign each request in the header as
        described below


        ### Authentication

        <i>How to verify that Glovo is sending the message</i>

        If partners would like to only accept and respond to requests from
        Glovo, we provide a way to verify that by signing the request and
        providing the partner with a key to verify that signature:


        The signature will be sent as a Header Glovo-Signature. It will hold the
        value of the base64 encoded signature (SHA256 with RSA) of the json
        payload:


        <div align="center" class="img-div">
          <img alt="collection image" src="img/loyalty-validation-schema.png#center" />
        </div>


        The signature would be something like this:

        ```

        xKkMzg/isYMHn18bqGdxT/g/awsCYVUICVWcuDs+kVQ3fAwpQRqMqX6iAh7tw3NGCDnP7v...ybziLg==

        ```


        To verify the signature, the API decodes the signature and checks that
        the payload is in fact the one sent and signed by Glovo. The
        SHA256withRSA is depicted as a black box because it is supported by many
        languages and libraries where you don’t need to worry about the exact
        implementation details.


        ### Public Key: 

        ```

        -----BEGIN PUBLIC KEY-----

        MIIBITANBgkqhkiG9w0BAQEFAAOCAQ4AMIIBCQKCAQB57AT5qawnzTePIqQp7Zfg

        Y/w4mdjAwxlCFJWVJc2hvleJeLjWH9wODL+lfAyUBZRhVqfxRzQ0rpS6JuBPXGs1

        4K/Fln+b+WtB8jxleL6+XdT/13eQFA4Vc9imJOKqtAZ+WTnyX7GYnqdTEZKCZC1f

        NjRcBpR7o6z5EpXet/nMifVfoTBW3bzCauVoF0ccQxKhSmmae3U/eym7YIklNLmC

        xucGmPbEHiaAawO1NWly2aHvzQYDccyeT6lCl17ZTK8izq/+P1G3OoFqcpBcQDaD

        5XLt2EH9r/JQZcnS4wwl0+mEoO0owoGrXoq3LkgA3EekAcU3hDeQmJGTpvyH9b3z

        AgMBAAE=

        -----END PUBLIC KEY-----

        ```


        <div align="center" class="img-div">
          <img alt="collection image" src="img/loyalty-validation-key-schema.png#center" />
        </div>
      operationId: Validate-loyalty-card
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                loyalty_id:
                  type: string
                  description: >
                    The loyalty card ID to validate.

                    Eg. "123AY986"


                    For loyalty IDs with phone numbers, the format sent in the
                    request will be "+{country-code}{whitespace}{number}".

                    Eg. "+34 123456789".
                timestamp:
                  type: long
                  description: Epoch timestamp in seconds when the request is sent.
                  example: 1721844342
              required:
                - loyalty_id
                - timestamp
      x-codeSamples:
        - lang: Curl
          source: |
            curl -X POST "https://partner.api/{partner-endpoint}" \
              -H "Content-Type: application/json" \
              -H "Glovo-Signature: <signature>" \
              -d '{
                "loyalty_id": "123AY986",
                "timestamp": 1721844342
              }'
      responses:
        '200':
          description: The request was successfully validated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Indicates if the loyalty ID is valid.
                    enum:
                      - VALID
                      - INVALID
                    example: VALID
        '429':
          description: |
            Too many requests, rate limit exceeded.


            Glovo will fail from the first call, no retries.
        '500':
          description: >
            Server error, validation failed after retries.



            Glovo will retry the call 3 times, 1 second apart, then will fail to
            validate and the customer loyalty will not be saved.
components:
  schemas:
    Order:
      type: object
      properties:
        order_id:
          allOf:
            - $ref: '#/components/schemas/OrderId'
        store_id:
          allOf:
            - $ref: '#/components/schemas/StoreId'
        order_time:
          type: string
          description: Local time of the acceptance of the order by Glovo
          format: yyyy-MM-dd HH:mm:ss
          example: '2018-06-08 14:24:53'
        estimated_pickup_time:
          type: string
          description: Local time of courier's expected arrival at the store
          format: yyyy-MM-dd HH:mm:ss
          example: '2018-06-08 14:45:44'
        utc_offset_minutes:
          type: string
          description: >-
            Time difference in minutes between UTC and the local time of the
            store
          format: int32
          example: '60'
        payment_method:
          type: string
          description: >
            - `CASH`: Indicates that the courier will pay for the order with
            cash


            - `DELAYED`: Indicates that Glovo will pay for the order by an
            invoice sent to the partner
          enum:
            - CASH
            - DELAYED
          example: CASH
        currency:
          type: string
          description: Currency code of the order
          example: EUR
        order_code:
          type: string
          description: >-
            Alphanumeric identifier of the order used for historical
            identification or by Glovo support
          example: BA7DWBUL
        allergy_info:
          type: string
          description: Customer provided details of their allergies
          example: I am allergic to tomato
        special_requirements:
          type: string
          description: >-
            Customer provided details of special requirements for the order (In
            case the store has this feature enabled, otherwise it will be null)
          example: Make sure there is no meat
        estimated_total_price:
          type: integer
          format: int32
          description: >-
            Estimated total price of products and attributes in the order
            denominated in cents and excluding the delivery fee
          example: 3080
        delivery_fee:
          type: integer
          format: int32
          description: >
            Delivery price of the order in cents. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be `null`
          example: null
        minimum_basket_surcharge:
          type: integer
          format: int32
          description: >
            The minimum basket surcharge in cents. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be `null`
          example: null
        customer_cash_payment_amount:
          type: integer
          format: int32
          description: >
            The total amount the customer will pay as cash. Relevant to
            [marketplace orders](#section/Getting-started/Marketplace-orders)
            only.


            If the order is delivered by Glovo or if this value is not informed
            by the customer, this will be set to `null`
          example: 5000
        courier:
          type: object
          description: Contains details of the assigned courier
          properties:
            name:
              type: string
              description: Courier name
              example: Flash
            phone_number:
              type: string
              description: Courier phone number with international prefix
              example: '+34666666666'
        customer:
          type: object
          description: Ordering customer's details
          properties:
            name:
              type: string
              description: Customer name
              example: Waldo
            phone_number:
              type: string
              description: >
                Customer phone number. Relevant to [marketplace
                orders](#section/Getting-started/Marketplace-orders) only.


                For Glovo orders this will be set to `"N/A"`
              example: N/A
            hash:
              type: string
              description: Unique identifier of the customer
              example: 11111111-2222-3333-4444-555555555555
            invoicing_details:
              type: object
              description: >-
                Customer invocing details (when provided). If not available this
                will be set to null`
              properties:
                company_name:
                  type: string
                  description: Company name
                  example: Acme Inc.
                company_address:
                  type: string
                  description: Address including city
                  example: 42 Wallaby Way, Sydney
                tax_id:
                  type: string
                  description: Tax ID
                  example: B12341234
        products:
          type: array
          minItems: 1
          description: List of order products
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the product within a store
                example: pd1
              purchased_product_id:
                type: string
                description: >
                  Unique identifier of every individual selection of a
                  (potentially customized) product within the order.

                  This identifier is necessary to perform order modifications
                  over the products purchased.
                example: A1
              quantity:
                type: integer
                format: int32
                description: Product quantity
                example: 2
              price:
                type: integer
                format: int32
                description: Product unit price (without attributes) in cents.
                example: 1000
              discount:
                type: integer
                format: int32
                description: Discount applied (to all units) in cents
                example: 500
              name:
                type: string
                description: Product name
                example: Burger
              attributes:
                type: array
                minItems: 0
                description: Attributes associated with the given product
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique identifier of the attribute within a store
                      example: at1
                    quantity:
                      type: integer
                      format: int32
                      description: Attribute quantity
                      example: 2
                    price:
                      type: integer
                      format: int32
                      description: Attribute unit price in cents
                      example: 300
                    name:
                      type: string
                      description: Attribute name
                      example: Extra meat
                  required:
                    - id
                    - quantity
                    - price
                    - name
              sub_products:
                type: array
                minItems: 0
                description: >
                  Array of sub-products contained in the order if the product is
                  a Combo. If it's not a Combo, this field will not be present.
                items:
                  type: object
                  properties:
                    quantity:
                      type: integer
                      format: int32
                      description: Quantity of sub-products
                      example: 1
                    price:
                      type: integer
                      format: int32
                      description: >-
                        Surcharge of sub-products in cents. If there is no
                        surcharge, this field will be set to 0.
                      example: 0
                    discount:
                      type: integer
                      format: int32
                      description: Discount applied to sub-products in cents.
                      example: 0
                    name:
                      type: string
                      description: Sub-product name
                      example: Coke
                    id:
                      type: string
                      description: Unique identifier of the sub-product within a store
                      example: sp1
                    attributes:
                      type: array
                      minItems: 0
                      description: Attributes associated with the given sub-product
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique identifier of the attribute within a store
                            example: at1
                          quantity:
                            type: integer
                            format: int32
                            description: Attribute quantity
                            example: 2
                          price:
                            type: integer
                            format: int32
                            description: Attribute unit price in cents
                            example: 100
                          name:
                            type: string
                            description: Attribute name
                            example: Extra meat
                        required:
                          - id
                          - quantity
                          - price
                          - name
                    packaging:
                      type: object
                      description: |
                        Subproduct's packaging
                      properties:
                        type:
                          type: string
                          description: Type of packaging
                          example: GLASS
                        price:
                          type: integer
                          format: int32
                          description: Packaging price in cents
                          example: 100
                        is_eco:
                          type: boolean
                          description: Indicates that the packaging is sustainable
                          example: true
                        is_returnable:
                          type: boolean
                          description: Indicates that the packaging can be returned
                          example: true
                      required:
                        - type
                        - price
                        - is_eco
                        - is_returnable
                  required:
                    - id
                    - quantity
                    - price
                    - discount
                    - name
                    - attributes
              packaging:
                type: object
                description: |
                  Product's packaging
                properties:
                  type:
                    type: string
                    description: Type of packaging
                    example: GLASS
                  price:
                    type: integer
                    format: int32
                    description: Packaging price in cents
                    example: 100
                  is_eco:
                    type: boolean
                    description: Indicates that the packaging is sustainable
                    example: true
                  is_returnable:
                    type: boolean
                    description: Indicates that the packaging can be returned
                    example: true
                required:
                  - type
                  - price
                  - is_eco
                  - is_returnable
              unavailability_strategy:
                type: object
                description: >
                  Pre-checkout product unavailability strategy. If the product
                  is found to be unavailable, this strategy will be applied to
                  the order.
                properties:
                  action:
                    type: string
                    description: >
                      Action to be applied in case the product is found to be
                      unavailable. Possible values are:

                      - `REMOVE`: The product can be removed and eventually
                      refunded.

                      - `REPLACE_WITH_BEST_MATCH`: The partner can replace
                      products based on the possible candidates provided in the
                      `alternative_products` field.

                      - `REPLACE_WITH_CUSTOMER_SELECTION`: The product can be
                      replaced by the single product specify by the customer in
                      the `alternative_products` field.
                    enum:
                      - REMOVE
                      - REPLACE_WITH_BEST_MATCH
                      - REPLACE_WITH_CUSTOMER_SELECTION
                    example: REMOVE
                  alternative_products:
                    type: array
                    description: >
                      Array of alternative products that can replace the
                      original product in case the former is found to be
                      unavailable.

                      - For `REPLACE_WITH_BEST_MATCH`, we send a list of
                      possible candidates for the pickers to choose a candidate
                      from.

                      - For `REPLACE_WITH_CUSTOMER_SELECTION`, we send only the
                      product chosen by the costumer.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the alternative product
                          example: '123456'
                        eans:
                          type: array
                          items:
                            type: string
                          description: The barcode numbers of the alternative product
                          example:
                            - '8410020402104'
                            - '8912420402104'
                      required:
                        - id
            required:
              - id
              - name
              - quantity
              - price
              - attributes
              - purchased_product_id
          example:
            - id: pd1
              purchased_product_id: A1
              name: Burger
              price: 1000
              discount: 1550
              quantity: 2
              attributes:
                - id: at1
                  name: Extra meat
                  price: 300
                  quantity: 1
                - id: at2
                  name: Water (33 cl)
                  price: 0
                  quantity: 1
                - id: at3
                  name: Tomato sauce
                  price: 0
                  quantity: 1
                - id: at4
                  name: Lettuce
                  price: 0
                  quantity: 1
              packaging:
                - type: GLASS
                  price: 100
                  is_eco: true
                  is_returnable: true
            - id: pd2
              purchased_product_id: A2
              name: Ice cream
              price: 480
              discount: 0
              quantity: 1
              attributes:
                - id: at5
                  name: Vanilla
                  price: 0
                  quantity: 1
                - id: at6
                  name: Small size
                  price: 0
                  quantity: 1
              packaging:
                - type: GLASS
                  price: 200
                  is_eco: false
                  is_returnable: true
            - id: pd3
              purchased_product_id: A3
              name: Burger Combo!
              price: 10000
              discount: 0
              quantity: 1
              attributes:
                - id: at7
                  name: Very large!
                  price: 300
                  quantity: 1
              sub_products:
                - id: sp1
                  name: Cheese Burger
                  price: 0
                  discount: 0
                  quantity: 1
                  attributes:
                    - id: at8
                      name: Extra cheese
                      price: 100
                      quantity: 1
                - id: sp2
                  name: Fries
                  price: 0
                  discount: 0
                  quantity: 1
                  attributes: []
                  packaging:
                    - type: GLASS
                      price: 150
                      is_eco: false
                      is_returnable: true
                - id: sp3
                  name: Coke
                  price: 0
                  discount: 0
                  quantity: 1
                  attributes:
                    - id: at9
                      name: Extra ice
                      price: 100
                      quantity: 1
        delivery_address:
          type: object
          description: >
            Order delivery address details. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be set to `null`
          properties:
            label:
              type: string
              description: Complete delivery address including city
              example: 123 Fake Street, Gotham
            latitude:
              type: number
              format: double
              description: Address latitude
              example: 41.3971955
            longitude:
              type: number
              format: double
              description: Address longitude
              example: 2.2001737
            street_name:
              type: string
              description: Address street name
              example: Fake Street
            street_number:
              type: string
              description: Address street number
              example: '123'
            province:
              type: string
              description: Address province name
              example: New Jersey
            postal_code:
              type: string
              description: Address postal code
              example: '60123'
            floor_number:
              type: string
              description: Address floor number
              example: '2'
            door_number:
              type: string
              description: Address door number
              example: '4'
            building_name:
              type: string
              description: Address building name
              example: The Conrad
            additional_information:
              type: string
              description: Free form information of the address
              example: The red door next to the blue sign.
        bundled_orders:
          type: array
          minItems: 1
          items:
            type: string
          description: >
            Bundled orders are those that are to be delivered together by a
            single courier. Relevant to Glovo orders only.


            For [marketplace
            orders](#section/Getting-started/Marketplace-orders) this will be
            set to `null`
          example:
            - order-id-1
            - order-id-2
        pick_up_code:
          type: string
          description: >-
            Non-sequential, non-unique 3 digit numerical code used to identify
            an order for pickup by the courier or customer
          example: '433'
        is_picked_up_by_customer:
          type: boolean
          description: >-
            Indicates that the order will be picked up by a customer instead of
            by a courier
          example: false
        cutlery_requested:
          type: boolean
          description: Indicates that the customer requested cutlery for the order
          example: true
        partner_discounts_products:
          type: integer
          format: int32
          description: >-
            Total value in cents of partner-funded promotional discounts applied
            to products
          example: 1550
        glovo_discounts_products:
          type: integer
          format: int32
          description: >-
            Total value in cents of glovo-funded promotional discounts applied
            to products
          example: 500
        partner_discounted_products_total:
          type: integer
          format: int32
          description: >-
            Total value in cents of products after partner-funded promotional
            discounts have been applied
          example: 1530
        discounted_products_total:
          type: integer
          format: int32
          description: >-
            Total value in cents of products after all promotional discounts
            have been applied
          example: 1030
        total_customer_to_pay:
          type: integer
          format: int32
          description: >
            The final amount to be paid in cents by customer after discounts,
            promotions, surcharges, fees and other adjustments have been
            calculated.


            Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If the order is delivered by Glovo this will be set to `null`
          example: null
        loyalty_card:
          type: string
          description: >
            Customer-provided store loyalty code. If the value is present, the
            Partner can choose to apply the corresponding rewards or discounts
            for the order to the identified loyalty customer.


            If the value is not provided by the customer this will be set to
            `null`
          example: CUSTOMER123
        voucher_code:
          type: string
          description: >
            Customer-provided store voucher code. If the value is present, the
            Partner can choose to apply the corresponding rewards or discounts
            for the order to the identified customer.


            If the value is not provided by the customer this will be set to
            `null`
          example: VOUCHER123
        service_fee:
          type: integer
          format: int32
          description: >
            Service fee of the order in cents. Relevant to [marketplace
            orders](#section/Getting-started/Marketplace-orders) only.


            If there is no service fee determined by Glovo, this field will be
            `null`
          example: 120
      required:
        - order_id
        - store_id
        - payment_method
        - currency
        - order_code
        - estimated_total_price
        - courier
        - customer
        - products
        - bundled_orders
        - is_picked_up_by_customer
        - partner_discounts_products
        - partner_discounted_products_total
        - service_fee
    Menu:
      type: object
      properties:
        attributes:
          type: array
          minItems: 0
          description: >
            A product can be customized in different ways e.g. add mayonnaise,
            bundle it with a drink, or add extra meat. 

            Each of these customizations is considered an attribute. It is not
            mandatory for a product to have attributes. 

            Each attribute can have a different price impact. Similar attributes
            are grouped into attribute groups. 


            Please note: to represent combos and cross-selling options, use the
            dedicated fields below.
          items:
            type: object
            properties:
              id:
                type: string
                description: >-
                  Unique identifier of the attribute within a store. Attributes
                  with the same `id` must only be created once or the menu will
                  be rejected.
              name:
                type: string
                description: Attribute name
              price_impact:
                type: number
                format: double
                description: >-
                  Attribute price, if price is lower than 0 it will be changed
                  to 0
              selected_by_default:
                type: boolean
                description: >-
                  Specifies if the attribute should be selected by default when
                  customizing the product associated
              available:
                type: boolean
                description: Specifies if the attribute is available to be purchased
            required:
              - id
              - price_impact
              - selected_by_default
        attribute_groups:
          type: array
          minItems: 0
          description: >
            Attribute groups allow to group similar customizations into generic
            groups. Each attribute group can have a minimum and maximum of
            choices for the customer.

            Examples of attribute groups could include:

            - Sauces: a group of attributes such as mayo, mustard or tomato
            sauce

            - Drinks: a group of attributes such as water, coke, or lemonade


            Please note: to represent combos and cross-selling options, use the
            dedicated fields below.
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the attribute group within a store
              name:
                type: string
                description: Attribute group name
              min:
                type: integer
                format: int32
                description: Minimum attributes a customer can choose from the group
              max:
                type: integer
                format: int32
                minimum: 1
                description: >-
                  Maximum attributes a customer can choose from the group, needs
                  to be bigger or equal than min
              collapse:
                type: boolean
                description: >-
                  Indicates whether the list of attributes within the group will
                  be displayed as collapsed by default in the customer apps
              multiple_selection:
                type: boolean
                description: >-
                  Indicates if the customer can choose more than one attribute
                  from the group
              attributes:
                type: array
                minItems: 1
                items:
                  type: string
                description: >-
                  List of attribute unique identifiers that would be part of the
                  group. Attributes will be displayed in the order of the list.
                  Attribute identifiers must refer to the `id` of existing
                  `attribute` elements, otherwise payload will be considered
                  invalid.
            required:
              - id
              - name
              - min
              - max
              - collapse
              - multiple_selection
              - attributes
        products:
          type: array
          minItems: 1
          description: >
            A product is the main component of a Glovo menu. It usually
            represents a physical product in a store, although we give stores
            flexibility to configure what they want to offer as products.

            Products included here should:

            - Either belong to a section

            - Or be part of a combo group
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier of the product within a store
              name:
                type: string
                description: Product name
              price:
                type: number
                format: double
                description: >-
                  Product price, if price is lower than 0 it will be changed to
                  0
              image_url:
                type: string
                format: uri
                description: Url of the main product image. Must use HTTPS protocol.
              extra_image_urls:
                type: array
                minItems: 0
                items:
                  type: string
                description: >
                  Array of urls of product extra images. Must use HTTPS
                  protocol. 

                  They will be displayed in the product detail page in the same
                  order as in the array, and always after the main image.

                  Support up to 9 images (if more images are sent, the first 9
                  will be processed).
              restrictions:
                type: object
                properties:
                  is_alcoholic:
                    type: boolean
                    description: Flag indicating if the product is an alcoholic beverage.
                  is_tobacco:
                    type: boolean
                    description: Flag indicating if the product is a tobacco product.
                description: >
                  Optional field to indicate if the product has any
                  restriction. 

                  It has some implications in some flows, e.g, This will trigger
                  a compliant user flow for alcohol restriction for stores in
                  Poland and Romania and for tobacco in Morocco.
              description:
                type: string
                description: Product description
              attributes_groups:
                type: array
                minItems: 0
                items:
                  type: string
                description: >-
                  List of attribute group unique identifiers that would be part
                  of the product. Attribute groups will be displayed in the
                  order of the list.
              available:
                type: boolean
                description: Specifies if the product is available to be purchased
              combo_groups:
                type: array
                minItems: 0
                description: >
                  **(Coming soon to production, available for testing in
                  stage)** List of combo groups encapsulating combo items.
                items:
                  type: object
                  required:
                    - name
                    - min
                    - max
                    - multiple_selection
                    - combo_items
                  properties:
                    name:
                      type: string
                      description: Combo group name visible to the users.
                    min:
                      type: integer
                      format: int32
                      description: >-
                        Minimum number of combo items a customer can choose from
                        the group.
                    max:
                      type: integer
                      format: int32
                      description: >-
                        Maximum number of combo items a customer can choose from
                        the group.
                    multiple_selection:
                      type: boolean
                      description: >-
                        Whether the customer can choose more than one combo item
                        from the combo group.
                    combo_items:
                      type: array
                      minItems: 1
                      description: List of combo items.
                      items:
                        type: object
                        required:
                          - product_id
                          - surcharge
                        properties:
                          product_id:
                            type: string
                            description: Reference to a standalone product.
                          surcharge:
                            type: number
                            format: double
                            description: >-
                              Surcharge on top of the standalone product's
                              price.
              cross_selling_options:
                type: array
                minItems: 0
                description: List of cross-selling options.
                items:
                  type: object
                  required:
                    - name
                    - products
                  properties:
                    name:
                      type: string
                      description: Name of the cross-selling options group.
                    products:
                      type: array
                      minItems: 1
                      description: List of references to standalone products.
                      items:
                        type: string
              dietary_labels:
                type: array
                minItems: 0
                items:
                  type: string
                description: >-
                  List of dietary labels that apply to the product. Available
                  labels (VEGAN, VEGETARIAN, GLUTEN_FREE, LACTOSE_FREE, HEALTHY,
                  HALAL, KOSHER)
              packaging:
                type: string
                description: |
                  Packaging ID for the product
            required:
              - id
              - name
              - price
        collections:
          type: array
          minItems: 1
          description: >
            A collection is the main categorization of a Glovo menu. It is
            mandatory to have at least one collection in your menu. It is
            composed by sections and it must have at least one to contain other
            elements. 

            Some examples of collections include: Drinks, Burgers, Salads,
            Desserts, Pasta.
          items:
            type: object
            properties:
              name:
                type: string
                description: >-
                  Collection name. It should be unique as it will serve as
                  identifier of the collection.
              position:
                type: integer
                format: int32
                description: Relative position of the collection in the menu
              image_url:
                type: string
                format: uri
                description: Url of the collection image. Must use HTTPS protocol.
              sections:
                type: array
                minItems: 1
                description: >
                  A section is a subdivision within a collection. Any collection
                  must contain at least one section with at least one product
                  associated. One section can include up to 200 products.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Section name
                    position:
                      type: integer
                      format: int32
                      description: Relative position of the section in the collection
                    products:
                      type: array
                      minItems: 1
                      items:
                        type: string
                      description: >-
                        List of products unique identifiers that would be part
                        of the section. Products will be displayed in the order
                        of the list.
                  required:
                    - name
                    - products
            required:
              - name
              - sections
        supercollections:
          type: array
          minItems: 0
          description: >
            A super collection is the uppermost categorization of a Glovo menu.
            Super collections are not required.

            If at least one exists, a list of all the super collections is
            displayed to customers when they open a store in the app. Otherwise,
            the collection is displayed as the uppermost categorization.
          items:
            type: object
            properties:
              name:
                type: string
                description: Super collection name
              position:
                type: integer
                format: int32
                description: Relative position of the super collection in the menu
              image_url:
                type: string
                format: uri
                description: Url of the super collection image. Must use HTTPS protocol.
              collections:
                type: array
                minItems: 1
                items:
                  type: string
                description: >-
                  List of collection names that would be part of the super
                  collection. Collections will be displayed in the order of the
                  list.
            required:
              - name
              - collections
        packagings:
          type: array
          minItems: 0
          description: >
            A list of packagings with prices. Each packaging can be linked to
            multiple products.
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier to link to the products
              reference_name:
                type: string
                description: Name of the packaging
              type_id:
                type: integer
                format: int32
                description: >-
                  Packaging type id of the packaging. Can be retrieved from the
                  [get packaging types
                  endpoint](#operation/Get-packaging-types).
              price:
                type: number
                format: double
                description: Price of packaging, will be added to the product price
            required:
              - id
              - reference_name
              - type_id
              - price
      example:
        attributes:
          - id: sauce_1
            name: Ketchup
            selected_by_default: false
            price_impact: 0
            available: true
          - id: sauce_2
            name: Mayo
            selected_by_default: false
            price_impact: 0
            available: true
          - id: sauce_3
            name: BBQ
            selected_by_default: false
            price_impact: 0
            available: true
          - id: pizza_size_1
