  /webhook/stores/{storeId}/orders/{orderId}/replace_products:
    post:
      tags:
        - Orders
      summary: Modify order products
      description: >
        This option allows an update to the products and attributes of an order
        when a customer asks for changes or the order cannot be fulfilled as
        initially requested.


        Depending on the information in the request body, we will replace
        products / attributes from the order, remove products from the order or
        add products to the order.


        An order can only be modified once. An attempt to modify an order more
        than once will result in an error.
      operationId: Modify-order-products
      parameters:
        - name: storeId
          in: path
          description: >
            [Unique identifier of the
            store](#section/Getting-started/Unique-identifier-of-the-store)
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          description: Unique identifier of the order to update
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          description: Specify that the content will be sent as JSON
          required: true
          schema:
            type: string
            default: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyOrder'
      x-codeSamples:
        - lang: Curl
          source: |
            curl --request POST \
                 --url https://api.glovoapp.com/webhook/stores/{storeId}/orders/{orderId}/replace_products \
                 --header 'Authorization: <your-secret-token>' \
                 --header 'content-type: application/json' \
                 --data '{
                    "replacements": [
                      {
                        "purchased_product_id": "MTg4MjcwNA==",
                        "product": {
                          "id": "pd6",
                          "quantity": 1,
                          "attributes": []
                        }
                      }
                    ],
                    "removed_purchases": [
                      "MTg4MjcwM1=="
                    ],
                    "added_products": [
                      {
                        "id": "pd8",
                        "quantity": 1,
                        "attributes": []
                      },
                      {
                        "id": "pd9",
                        "quantity": 2,
                        "attributes": [
                          {
                            "quantity": 1,
                            "id": "at1"
                          },
                          {
                            "quantity": 1,
                            "id": "at2"
                          },
                          {
                            "quantity": 1,
                            "id": "at3"
                          },
                          {
                            "quantity": 1,
                            "id": "at4"
                          }
                        ]
                      }
                    ]
                 }'
      responses:
        '200':
          description: >
            [Order](#tag/Modified-Order-model) with the products updated
            correctly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifiedOrder-2'
        '400':
          description: |
            Bad request. This may be caused by the following reasons:
              * Order has already been modified. An order can only be modified by this endpoint once.
              * An invalid request in which there are no products listed for replacement, removal or addition. Message: "Invalid body. All the lists are empty."
              * Order is already picked or cancelled and so cannot be modified. Message: "Invalid order status"
              * Order is a big order and so is automatically split, so cannot be updated. Message: "Cannot change products in automatically split orders"
              * The newly modified order that the request makes exceeds the maximum size permitted in proportion to the original order. This cannot be twice the size of the original order, although all modified orders smaller or equal to 5 are permitted. Message: "Modified order quantity exceeds maximum permitted."
              * The order modification lists contain a product id that does not exist. Message: "Purchased product id <<PRODUCT-ID>> not present in the original order"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '409':
          description: |
            Conflict. This may be caused by the following reasons:
              * The order hasn't been accepted yet
              * The order has already been picked up
        '422':
          description: |
            Unprocessable Content. This may be caused by the following reasons:
              * We cannot fulfill the replace operation for this product. The product was disabled.
      security:
        - token: []
