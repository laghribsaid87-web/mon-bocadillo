    MenuValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Specifies if the menu is valid or not
        errors:
          type: array
          description: Detailed information of the errors generated by JSON schema
          items:
            type: string
        warnings:
          type: array
          description: Detailed information of the warnings generated by JSON schema
          items:
            type: string
    AcceptOrder:
      type: object
      properties:
        committedPreparationTime:
          type: string <UTC Timestamp>
          description: >
            Optional field that represents the point of time in the future when
            order is expected to be ready by the store.

            It allows Glovo to improve the accuracy of the estimated time of
            arrival of couriers to the store.


            The field must is in UTC format complying to ISO 8601 standard and
            should contain complete date as well as hours, minutes and seconds
            as follows:


            `YYYY-MM-DDThh:mm:ssZ` (Example: `2024-02-02T19:20:30Z`)


            If the validation of this field fails, the order will still be
            accepted with a response containing validation result, but the
            committed preparation time will not be registered.

            Important: Committed preparation time can only be increased up to 10
            minutes.
          example: '2024-02-02T19:20:30Z'
    AcceptOrderResponse:
      type: object
      properties:
        invalid-params:
          type: array
          minItems: 1
          description: List of parameters that are invalid
          required: true
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the parameter that is invalid
                example: committedPreparationTime
              reason:
                type: string
                description: Reason why the parameter is invalid
                example: Committed preparation time is missing.
            required:
              - name
              - reason
        title:
          type: string
          description: Title of the error
          required: true
          example: Your request parameters are not valid.
    OrderCancelled:
      type: object
      properties:
        order_id:
          allOf:
            - $ref: '#/components/schemas/OrderId'
        store_id:
          allOf:
            - $ref: '#/components/schemas/StoreId'
        cancel_reason:
          type: string
          enum:
            - PRODUCTS_NOT_AVAILABLE
            - STORE_CAN_NOT_DELIVER
            - PARTNER_PRINTER_ISSUE
            - USER_ERROR
            - ORDER_NOT_FEASIBLE
            - OTHER
          description: >
            Description of order cancellation reason


            - `PRODUCTS_NOT_AVAILABLE`: Products are not available in store

            - `STORE_CAN_NOT_DELIVER`: Order could not be delivered by partner

            - `PARTNER_PRINTER_ISSUE`: Order cancelled due to issues with
            partner's device

            - `USER_ERROR`: Customer has cancelled the order

            - `ORDER_NOT_FEASIBLE`: It is impossible to fulfill the customer's
            request

            - `OTHER`: Other cancellation reasons that do not fall into the
            above categories
          example: STORE_ERROR
        payment_strategy:
          type: string
          enum:
            - PAY_NOTHING
            - PAY_PRODUCTS
          description: >
            - `PAY_NOTHING`: Glovo will not pay the partner for the order
            products

            - `PAY_PRODUCTS`: Glovo will pay the partner for the order products
          example: PAY_PRODUCTS
      required:
        - order_id
        - store_id
        - cancel_reason
  securitySchemes:
    token:
      description: >
        All incoming requests to our API must include the specified header
        including your token.


        ```

        Authorization: token

        ```

        In order to validate that Glovo is the one making requests to your
        [registered
        webhooks](#section/Getting-started/Event-notifications-using-webhooks)
        for event notifications, we will also be sending you this
        `Authorization` header including the `token`.
      type: apiKey
      name: Authorization
      in: header
  responses:
    ResponseDescription:
      description: >
        Return a 200 status to indicate that the data was received successfully.


        If our systems do not receive a 2xx status response, we will start a
        notification retry process based on an exponential backoff algorithm.
        The goal is to improve the chance that our notifications successfully
        reach your servers. We will have a default maximum 3 retries for each
        notification.


        From your side it's important to ensure that you are processing the
        requests in an **idempotent manner**; you should deduplicate order IDs
        to avoid processing the same order information more than once.
x-webhooks:
  orderDispatched:
    post:
      summary: Order Dispatched
      description: >
        You will receive a a `POST` request notification every time an order is
        dispatched to any of your registered stores.


        This notification is sent to stores so that they can start to prepare
        the order. This notification is sent at a time determined by the
        courier's expected arrival time and the store's own estimated time
        necessary for the preparation of the order.


        <div class="alert-box warn">
          <i data-feather="alert-triangle"></i>
          It's important that you comply with our <a href="#tag/Versioning">versioning</a> specifications once you start handling our notifications.
        </div>
      operationId: Order-dispatched
      tags:
        - Notifications
      method:
        - POST
      parameters:
        - name: Content-Type
          in: header
          description: Specify that the content will be sent as JSON
          required: true
          schema:
            type: string
            default: application/json
      security:
        - token: []
      requestBody:
        description: |
          Notification with the [Order model](#tag/Order-model) format
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          $ref: '#/components/responses/ResponseDescription'
  orderCancelled:
    post:
      summary: Order Cancelled
      description: >
        You will receive a `POST` request notification every time an order is
        cancelled.


        This notification will be sent **only if the order has previously been
        dispatched to the store.**
      operationId: Order-cancelled
      tags:
        - Notifications
      parameters:
        - name: Content-Type
          in: header
          description: Specify that the content will be sent as JSON
          required: true
          schema:
            type: string
            default: application/json
      security:
        - token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancelled'
      responses:
        '200':
          $ref: '#/components/responses/ResponseDescription'
