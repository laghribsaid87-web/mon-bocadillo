  /webhook/stores/{storeId}/menu/updates:
    post:
      tags:
        - Menu-items
      summary: Bulk update items
      description: >
        Allows you to partially modify multiple products and attributes as part
        of a single request.


        If there are fields of the items you want to leave unchanged, simply do
        not specify them in the request (see the JSON example).

        Do not set the value of fields you do not want to modify - neither to
        null nor to an empty array!


        This process is asynchronous, so we will provide a `transaction_id` to
        follow the process with the [Verify bulk update items status
        endpoint](#operation/Verify-bulk-update-items)


        This is a convenient option when you have to perform massive updates in
        your store catalog.

        Although this is an async process, the performance is significantly
        better than sending a request per product with the `PATCH` endpoints.


        <div class="alert-box info">
          <i data-feather="info"></i>
          The maximum number of items that can be processed in a single request is <strong>10000</strong>. In case the total number is exceeded the request will return an error.
        </div>


        If for some reason the Glovo system fails while updating, it is possible
        for the bulk update process to succeed only partially: some items will
        be updated while others will not.

        Concrete details will be given on the bulk update status endpoint.


        Promotions field allows you to apply multiple promotions as part of a
        single request. 


        Note that both processes (items and promotions updates) are asynchronous
        and independent from each other.

        Therefore, if one process fails, it does not necessarily imply that the
        other has also failed.


        More information about the Promotion's schema can be found here:
        [Promotion Model](#tag/Promotion-model)


        **Note: to view all promotion type example click on `Request Samples >
        curl`** 
